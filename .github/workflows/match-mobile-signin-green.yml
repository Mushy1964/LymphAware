name: Match mobile sign in green

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-mobile-signin-green.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match mobile sign in to site green
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/public-chrome.css')
          css = p.read_text(encoding='utf-8')
          if 'background: #2f9a44;' not in css:
              raise SystemExit('Mobile sign in background not found')
          css = css.replace('background: #2f9a44;', 'background: #4c9b57;', 1)
          css = css.replace('background: #27833a;', 'background: #2f6f3a;', 1)
          p.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Match mobile sign in button to site green"
          git push
