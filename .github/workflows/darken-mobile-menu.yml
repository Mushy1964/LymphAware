name: Darken mobile menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/darken-mobile-menu.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace colourful icon menu with dark navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/public-chrome.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* Dark mobile navigation refinement */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'
          css += r'''
/* Dark mobile navigation refinement */
@media (max-width: 680px) {
  .public-mobile-panel {
    width: min(352px, calc(100vw - 24px));
    padding: 0;
    border: 0;
    border-radius: 16px;
    overflow: auto;
    background: linear-gradient(180deg, #263d77 0%, #203568 100%);
    box-shadow: 0 20px 48px rgba(20, 36, 67, .28);
  }

  .public-mobile-panel a {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 58px;
    margin: 0;
    padding: 0 46px 0 22px;
    border-radius: 0;
    border-bottom: 1px dashed rgba(255,255,255,.20);
    background: transparent;
    color: #fff;
    font-weight: 760;
    letter-spacing: .01em;
    transition: background .16s ease, padding-left .16s ease;
  }

  .public-mobile-panel a::before {
    content: none !important;
    display: none !important;
  }

  .public-mobile-panel a::after {
    content: "›";
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-52%);
    color: rgba(255,255,255,.92);
    font-size: 1.65rem;
    font-weight: 400;
    line-height: 1;
  }

  .public-mobile-panel a:hover,
  .public-mobile-panel a:focus {
    background: rgba(20, 120, 200, .32);
    color: #fff;
    padding-left: 27px;
    transform: none;
    outline: none;
  }

  .public-mobile-panel a:nth-child(5) {
    margin-top: 0;
    padding-top: 0;
  }

  .public-mobile-panel a:nth-child(5)::after {
    content: "›";
    position: absolute;
    left: auto;
    right: 20px;
    top: 50%;
    width: auto;
    height: auto;
    background: transparent;
    transform: translateY(-52%);
  }

  .public-mobile-panel .public-mobile-account {
    min-height: 58px;
    margin: 0;
    padding: 0 22px;
    justify-content: center;
    border: 0;
    border-radius: 0 0 16px 16px;
    background: #eaf6ed;
    color: #2b6f39;
    text-align: center;
    font-weight: 850;
  }

  .public-mobile-panel .public-mobile-account::before,
  .public-mobile-panel .public-mobile-account::after {
    content: none !important;
    display: none !important;
  }

  .public-mobile-panel .public-mobile-account:hover,
  .public-mobile-panel .public-mobile-account:focus {
    background: #dff1e4;
    color: #245f31;
    padding-left: 22px;
  }
}
'''
          p.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Use dark mobile navigation without icons"
          git push
