name: Darken mobile menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/darken-mobile-menu.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace colourful icon menu with dark navigation
        run: python -c "from pathlib import Path; import base64; p=Path('css/public-chrome.css'); css=p.read_text(encoding='utf-8'); marker='/* Dark mobile navigation refinement */'; css=(css.split(marker)[0].rstrip()+'\\n') if marker in css else css.rstrip()+'\\n'; css += base64.b64decode('').decode(); p.write_text(css, encoding='utf-8')"
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Use dark mobile navigation without icons"
          git push
