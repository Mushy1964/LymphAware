name: One-time profile editor tidy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-profile-editor-tidy.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tidy profile editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profile-v2/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.form-group input,.form-group textarea{width:100%;padding:11px 13px;border:1px solid #bfcbd2;border-radius:9px;font:inherit;background:#fff;color:#172536}', '.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 13px;border:1px solid #bfcbd2;border-radius:9px;font:inherit;background:#fff;color:#172536}')
          s=s.replace('.form-group input:focus,.form-group textarea:focus{outline:3px solid rgba(40,120,184,.14);border-color:#2878b8}', '.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:3px solid rgba(40,120,184,.14);border-color:#2878b8}')
          s=s.replace('.profile-photo-controls{min-width:0;flex:1}.profile-photo-controls input{position:absolute;left:-9999px}', '.profile-photo-controls{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.profile-photo-controls input{position:absolute;left:-9999px}.photo-button{display:inline-flex!important;align-items:center;justify-content:center;text-align:center;min-width:190px;width:auto!important;min-height:46px;padding:0 20px!important}')
          s=s.replace('@media(max-width:680px){.profile-page{padding:36px 12px}.profile-site-header .header-inner{width:calc(100% - 24px);min-height:72px;gap:12px}.profile-site-header .header-logo{width:220px;max-width:calc(100vw - 170px)}.profile-site-header .header-actions .button{min-height:44px;padding:0 13px;font-size:.86rem}', '@media(max-width:680px){.profile-page{padding:36px 12px}.profile-site-header .header-inner{width:calc(100% - 24px);min-height:72px;gap:10px}.profile-site-header .header-logo{width:220px;max-width:calc(100vw - 118px)}.profile-site-header .header-actions .button{min-width:72px!important;min-height:44px;padding:0 10px!important;font-size:0!important}.profile-site-header .header-actions .button::after{content:"Portal";font-size:.92rem;font-weight:700;line-height:1.2}')
          s=s.replace('.profile-photo-preview{width:82px;height:102px;flex-basis:82px}.master-visibility', '.profile-photo-preview{width:82px;height:102px;flex-basis:82px}.profile-photo-section{align-items:center}.profile-photo-controls{align-items:center;text-align:center}.profile-photo-controls .field-help{text-align:left}.photo-button{width:100%!important;max-width:280px}.master-visibility')
          s=s.replace('<label class="button button-secondary" for="photo-input">Choose Photograph</label>', '<label class="button button-secondary photo-button" for="photo-input">Choose Photograph</label>')
          s=s.replace('<input id="lymph-type" type="text" placeholder="For example: secondary lymphoedema">', '<select id="lymph-type"><option value="">Select type</option><option value="Primary lymphoedema">Primary lymphoedema</option><option value="Secondary lymphoedema">Secondary lymphoedema</option></select>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-v2/index.html
          git commit -m "Tidy About Me and lymphoedema type controls"
          git push
