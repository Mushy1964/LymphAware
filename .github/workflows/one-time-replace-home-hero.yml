name: One-time replace homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-replace-home-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace hero image
        run: python scripts/one_time_replace_home_hero.py
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace homepage hero with approved transparent image"
          git push
