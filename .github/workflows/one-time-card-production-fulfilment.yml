name: One-time card production fulfilment UI

on:
  push:
    paths:
      - '.github/workflows/one-time-card-production-fulfilment.yml'

permissions:
  contents: write

jobs:
  update-card-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add fulfilment details to card production
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin/card-production/index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = """    .production-details {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 14px 22px;\n      margin-top: 18px;\n      color: var(--muted);\n    }\n"""

          css_replacement = css_anchor + """\n    .production-fulfilment {\n      margin-top: 18px;\n      padding: 14px 16px;\n      border: 1px solid #dce8e1;\n      border-radius: 12px;\n      background: #f7fbf8;\n      line-height: 1.55;\n    }\n\n    .production-fulfilment strong {\n      color: var(--text);\n    }\n\n    .production-fulfilment-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 8px 22px;\n      margin-top: 6px;\n    }\n\n    .production-language-note {\n      margin-top: 8px;\n      color: var(--blue-dark);\n      font-weight: 700;\n    }\n"""

          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css_replacement, 1)

          js_anchor = """    const printedButton =\n      status === 'PREPARED'\n        ? `\n          <button\n            type=\"button\"\n            class=\"button button-secondary mark-printed\"\n            data-profile-id=\"${escapeHtml(profile.id)}\">\n            Mark as Printed\n          </button>\n        `\n        : '';\n\n      const prepareButton =\n"""

          js_replacement = """    const fulfilment = profile.fulfilment || {};\n    const orderNumbers = Array.isArray(fulfilment.order_numbers)\n      ? fulfilment.order_numbers\n      : [];\n    const cardCopies = Number(fulfilment.card_copies || 1);\n    const lanyardHolders = Number(fulfilment.lanyard_holders || 0);\n    const languagePackages = Array.isArray(fulfilment.language_packages)\n      ? fulfilment.language_packages\n      : [];\n\n    const languageSummary = languagePackages.length\n      ? languagePackages\n          .map(item => `${escapeHtml(item.language_name || 'Language not specified')} × ${Number(item.quantity || 0)}`)\n          .join(', ')\n      : '';\n\n    const printedButton =\n      status === 'PREPARED'\n        ? `\n          <button\n            type=\"button\"\n            class=\"button button-secondary mark-printed\"\n            data-profile-id=\"${escapeHtml(profile.id)}\">\n            Mark as Printed\n          </button>\n        `\n        : '';\n\n      const prepareButton =\n"""

          if js_anchor not in text:
              raise SystemExit('JS anchor not found')
          text = text.replace(js_anchor, js_replacement, 1)

          html_anchor = """      <div class=\"production-details\">\n\n        <span>\n          Photograph ✓\n        </span>\n"""

          html_replacement = """      <div class=\"production-fulfilment\">\n        <strong>Fulfilment</strong>\n        <div class=\"production-fulfilment-row\">\n          <span>Order: ${escapeHtml(orderNumbers.length ? orderNumbers.join(', ') : 'No linked order')}</span>\n          <span>Card copies: <strong>${cardCopies}</strong></span>\n          <span>Lanyard &amp; holders: <strong>${lanyardHolders}</strong></span>\n        </div>\n        ${languageSummary\n          ? `<div class=\"production-language-note\">Additional language package: ${languageSummary} — separate language card/profile setup required.</div>`\n          : ''}\n      </div>\n\n      <div class=\"production-details\">\n\n        <span>\n          Photograph ✓\n        </span>\n"""

          if html_anchor not in text:
              raise SystemExit('HTML anchor not found')
          text = text.replace(html_anchor, html_replacement, 1)

          notice_old = """      EasyBadge exports should be used only for producing\n      authorised LymphAware cards. Check the patient's name,\n      photograph, LymphAware ID and QR code before printing.\n"""
          notice_new = """      EasyBadge exports are generated fresh from all cards currently marked Ready.\n      Check the patient's name, photograph, LymphAware ID and QR code before printing,\n      and use the fulfilment quantities shown on each job for duplicate cards and lanyards.\n"""
          if notice_old in text:
              text = text.replace(notice_old, notice_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "LymphAware automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/card-production/index.html
          git commit -m "Show order fulfilment quantities in card production"
          git push
