name: One-time contextual internal links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-contextual-internal-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add contextual internal links
        run: python scripts/one_time_contextual_internal_links.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add index.html contact/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve contextual internal linking"
          git push
