name: One-time membership tier styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-membership-tier-styling.yml'

permissions:
  contents: write

jobs:
  update-membership-tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Style membership cards as bronze silver gold tiers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css_lines = [
              '',
              '    /* Bronze / Silver / Gold membership tiers */',
              '    .home-membership-packages .home-membership-price-card { position: relative; overflow: hidden; border-width: 1px; border-top-width: 6px; transition: transform .16s ease, box-shadow .16s ease; }',
              '    .home-membership-packages .home-membership-price-card:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(31, 47, 66, 0.11); }',
              '    .home-membership-tier-bronze { border-color: #b88663; background: linear-gradient(180deg, #fffaf6 0%, #ffffff 34%); }',
              '    .home-membership-tier-silver { border-color: #aab4be; background: linear-gradient(180deg, #f8fafc 0%, #ffffff 34%); }',
              '    .home-membership-tier-gold { border-color: #d2ac4d; background: linear-gradient(180deg, #fffaf0 0%, #ffffff 34%); box-shadow: 0 16px 36px rgba(149, 111, 20, 0.11); }',
              '    .home-membership-packages .home-membership-package-badge { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-width: 72px; min-height: 30px; margin: 0 0 14px; padding: 5px 12px; border-radius: 999px; font-size: .82rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }',
              '    .home-membership-tier-bronze .home-membership-package-badge { background: #f2e3d8; color: #87502f; }',
              '    .home-membership-tier-silver .home-membership-package-badge { background: #e9edf1; color: #566370; }',
              '    .home-membership-tier-gold .home-membership-package-badge { background: #f7eac4; color: #8a650c; }',
              '    .home-membership-tier-bronze .home-membership-price { color: #9a5d37; }',
              '    .home-membership-tier-silver .home-membership-price { color: #667481; }',
              '    .home-membership-tier-gold .home-membership-price { color: #a77a0d; }',
              '    .home-membership-packages .home-membership-price-label { display: flex; align-items: flex-end; min-height: 30px; }',
              ''
          ]
          css = '\n'.join(css_lines)
          if '/* Bronze / Silver / Gold membership tiers */' not in s:
              s = s.replace('  </style>', css + '\n  </style>', 1)
          s = s.replace('<article class="home-membership-price-card">\n          <p class="home-membership-price-label">5-Year Membership</p>', '<article class="home-membership-price-card home-membership-tier-bronze">\n          <p class="home-membership-package-badge">Bronze</p>\n          <p class="home-membership-price-label">5-Year Membership</p>', 1)
          s = s.replace('<article class="home-membership-price-card home-membership-package-featured">\n          <p class="home-membership-package-badge">Extra card &amp; holder</p>', '<article class="home-membership-price-card home-membership-tier-silver">\n          <p class="home-membership-package-badge">Silver</p>', 1)
          s = s.replace('<article class="home-membership-price-card">\n          <p class="home-membership-package-badge">For use in two languages</p>', '<article class="home-membership-price-card home-membership-tier-gold">\n          <p class="home-membership-package-badge">Gold</p>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style membership packages as bronze silver and gold"
          git push
