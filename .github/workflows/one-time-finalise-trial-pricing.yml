name: One-time trial pricing consistency update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-finalise-trial-pricing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply agreed pricing wording and P&P email fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once_or_confirm(text, old, new, label):
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  return text.replace(old, new)
              if old_count == 0 and new_count == 1:
                  return text
              raise SystemExit(f'{label}: expected old or new text exactly once; old={old_count}, new={new_count}')

          homepage = Path('index.html')
          text = homepage.read_text(encoding='utf-8')
          text = replace_once_or_confirm(
              text,
              'Postage &amp; packing is currently £2.99 for the United Kingdom, £4.99 for Europe and £9.99 for the Rest of World.',
              'Postage &amp; packing is £2.99 for the United Kingdom, £4.99 for Europe and £9.99 for the Rest of World.',
              'Homepage postage rates'
          )
          text = replace_once_or_confirm(
              text,
              'These temporary rates are applied once per order and can be updated when final delivery costs are confirmed. You will be reminded before your five-year membership is due to expire, so you can choose whether to renew.',
              'Postage &amp; packing is applied once per order. You will be reminded before your five-year membership is due to expire, so you can choose whether to renew.',
              'Homepage postage note'
          )
          homepage.write_text(text, encoding='utf-8')

          portal = Path('portal/index.html')
          text = portal.read_text(encoding='utf-8')
          text = replace_once_or_confirm(
              text,
              'Temporary postage rates: UK £2.99, Europe £4.99 and Rest of World £9.99. The full delivery address is confirmed securely during payment.',
              'Postage &amp; packing: UK £2.99, Europe £4.99 and Rest of World £9.99. The full delivery address is confirmed securely during checkout.',
              'Portal postage note'
          )
          portal.write_text(text, encoding='utf-8')

          webhook = Path('netlify/functions/stripe-webhook.mjs')
          text = webhook.read_text(encoding='utf-8')
          old_calc = "  const postagePaid = `£${((session.total_details?.amount_shipping || 0) / 100).toFixed(2)}`;"
          new_calc = "  const postageChargePence = Number(session.metadata?.shipping_pence || session.total_details?.amount_shipping || 0);\n  const postagePaid = `£${(postageChargePence / 100).toFixed(2)}`;"
          old_count = text.count(old_calc)
          new_count = text.count(new_calc)
          if old_count == 2:
              text = text.replace(old_calc, new_calc)
          elif not (old_count == 0 and new_count == 2):
              raise SystemExit(f'Webhook postage calculation: expected two old or two new blocks; old={old_count}, new={new_count}')

          old_label = 'Postage & packing: ${postagePaid}'
          new_label = 'Postage & packing (before any promotion discount): ${postagePaid}'
          old_count = text.count(old_label)
          new_count = text.count(new_label)
          if old_count == 2:
              text = text.replace(old_label, new_label)
          elif not (old_count == 0 and new_count == 2):
              raise SystemExit(f'Webhook postage label: expected two old or two new labels; old={old_count}, new={new_count}')
          webhook.write_text(text, encoding='utf-8')

      - name: Commit update
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html portal/index.html netlify/functions/stripe-webhook.mjs
          if git diff --cached --quiet; then
            echo "No content changes were needed."
            exit 0
          fi
          git commit -m "Finalise agreed pricing and postage reporting"
          git push
