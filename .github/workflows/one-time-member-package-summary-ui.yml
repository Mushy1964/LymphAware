name: One-time member package summary UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-member-package-summary-ui.yml'

permissions:
  contents: write

jobs:
  update-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add package summary to member portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('portal/index.html')
          s=p.read_text(encoding='utf-8')

          css_marker="    .membership-payment-actions{margin-top:24px}.membership-payment-actions[hidden]{display:none!important}.membership-term{margin:0 0 18px!important;color:var(--text)!important;font-weight:700}\n"
          css_add=css_marker+"    .owned-package-summary{margin-top:18px;padding:17px 18px;border:1px solid #c8ddd0;border-radius:14px;background:#fff}.owned-package-summary[hidden]{display:none!important}.owned-package-kicker{margin:0 0 5px!important;color:#16853f!important;font-size:.88rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}.owned-package-name{margin:0 0 7px!important;color:var(--text)!important;font-size:1.2rem;font-weight:800}.owned-package-includes{margin:0!important;color:#4e5f6e!important;line-height:1.5}.owned-package-added{margin:10px 0 0!important;padding-top:10px;border-top:1px solid #e2ebe6;color:#355b77!important;font-weight:700}\n"
          if css_marker not in s: raise SystemExit('CSS marker not found')
          s=s.replace(css_marker,css_add,1)

          html_marker='        <p id="membership-message"></p>\n        <div id="membership-payment-actions" class="membership-payment-actions" hidden>'
          html_add='        <p id="membership-message"></p>\n        <div id="owned-package-summary" class="owned-package-summary" hidden><p class="owned-package-kicker">Your LymphAware package</p><p id="owned-package-name" class="owned-package-name"></p><p id="owned-package-includes" class="owned-package-includes"></p><p id="owned-package-added" class="owned-package-added" hidden></p></div>\n        <div id="membership-payment-actions" class="membership-payment-actions" hidden>'
          if html_marker not in s: raise SystemExit('HTML marker not found')
          s=s.replace(html_marker,html_add,1)

          const_marker="const portalLoading=document.getElementById('portal-loading'),portalContent=document.getElementById('portal-content'),portalTitle=document.getElementById('portal-title'),portalIntro=document.getElementById('portal-intro'),portalMessage=document.getElementById('portal-message'),signOutButton=document.getElementById('sign-out-button'),membershipStatus=document.getElementById('membership-status'),membershipMessage=document.getElementById('membership-message'),membershipPendingContent=document.getElementById('membership-pending-content'),membershipPaymentActions=document.getElementById('membership-payment-actions'),payMembershipButton=document.getElementById('pay-membership-button'),memberContent=document.getElementById('member-content'),onboardingPanel=document.getElementById('onboarding-panel'),accessoriesPanel=document.getElementById('accessories-panel'),languageProfilesPanel=document.getElementById('language-profiles-panel'),languageProfileList=document.getElementById('language-profile-list'),paymentResult=document.getElementById('payment-result'),languageChoice=document.getElementById('language-choice'),membershipLanguageCode=document.getElementById('membership-language-code'),membershipDeliveryCountry=document.getElementById('membership-delivery-country'),additionalLanguageCode=document.getElementById('additional-language-code'),additionalDeliveryCountry=document.getElementById('additional-delivery-country'),buyLanguageButton=document.getElementById('buy-language-button'),additionalLanguageMessage=document.getElementById('additional-language-message'),orderTotal=document.getElementById('membership-order-total');\n"
          const_add=const_marker+"const ownedPackageSummary=document.getElementById('owned-package-summary'),ownedPackageName=document.getElementById('owned-package-name'),ownedPackageIncludes=document.getElementById('owned-package-includes'),ownedPackageAdded=document.getElementById('owned-package-added');\n"
          if const_marker not in s: raise SystemExit('Const marker not found')
          s=s.replace(const_marker,const_add,1)

          function_marker="async function loadOnboardingStatus(userId){const {data,error}=await supabaseClient.from('profiles').select('display_name,photo_path').eq('user_id',userId).maybeSingle();if(error){console.error(error);return}onboardingPanel.hidden=Boolean(data&&data.display_name?.trim()&&data.photo_path?.trim())}\n"
          function_add=function_marker+"async function loadOwnedPackageSummary(){ownedPackageSummary.hidden=true;const token=await getSessionToken();if(!token)return;try{const response=await fetch('/.netlify/functions/member-package-summary',{headers:{Authorization:`Bearer ${token}`}}),result=await response.json();if(!response.ok||!result?.package)return;ownedPackageName.textContent=result.package.name||'LymphAware membership';ownedPackageIncludes.textContent=result.package.included_summary||'';const extras=Array.isArray(result.additional_languages)?result.additional_languages:[];ownedPackageAdded.hidden=!extras.length;ownedPackageAdded.textContent=extras.length?`Additional language${extras.length>1?'s':''} added later: ${extras.join(', ')}`:'';ownedPackageSummary.hidden=false}catch(error){console.error('Unable to load package summary:',error)}}\n"
          if function_marker not in s: raise SystemExit('Function marker not found')
          s=s.replace(function_marker,function_add,1)

          entitled_marker="if(entitled){await loadOnboardingStatus(user.id);await loadLanguageProfiles(user.id)}portalLoading.style.display='none';"
          entitled_add="if(entitled){await loadOnboardingStatus(user.id);await loadLanguageProfiles(user.id);await loadOwnedPackageSummary()}portalLoading.style.display='none';"
          if entitled_marker not in s: raise SystemExit('Entitled marker not found')
          s=s.replace(entitled_marker,entitled_add,1)

          refresh_marker="if(hasPortalEntitlement(m)){await renderMembership(m);await loadOnboardingStatus(currentUserId);await loadLanguageProfiles(currentUserId);paymentResult.textContent='Payment confirmed. Your LymphAware Patient Portal is now active and your order has been received.';return}"
          refresh_add="if(hasPortalEntitlement(m)){await renderMembership(m);await loadOnboardingStatus(currentUserId);await loadLanguageProfiles(currentUserId);await loadOwnedPackageSummary();paymentResult.textContent='Payment confirmed. Your LymphAware Patient Portal is now active and your order has been received.';return}"
          if refresh_marker not in s: raise SystemExit('Refresh marker not found')
          s=s.replace(refresh_marker,refresh_add,1)

          language_refresh_marker="if(type==='language'){for(let i=0;i<4;i++){await loadLanguageProfiles(currentUserId);await new Promise(r=>setTimeout(r,900))}paymentResult.textContent='Payment confirmed. Your additional-language order has been received.';return}"
          language_refresh_add="if(type==='language'){for(let i=0;i<4;i++){await loadLanguageProfiles(currentUserId);await new Promise(r=>setTimeout(r,900))}await loadOwnedPackageSummary();paymentResult.textContent='Payment confirmed. Your additional-language order has been received.';return}"
          if language_refresh_marker not in s: raise SystemExit('Language refresh marker not found')
          s=s.replace(language_refresh_marker,language_refresh_add,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/index.html
          git commit -m "Show purchased package in member portal"
          git push
