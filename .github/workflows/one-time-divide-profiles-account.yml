name: One-time divide Profiles & account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-divide-profiles-account.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Divide Profiles and account section
        run: python scripts/one_time_divide_profiles_account.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add portal/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Divide Profiles and account into clearer sections"
          git push
