name: One-time homepage hero refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-hero-refine.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply homepage hero refinements
        run: python scripts/one_time_home_hero_refine.py

      - name: Commit changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html css/home.css
          git commit -m "Refine homepage hero message and spacing"
          git push
