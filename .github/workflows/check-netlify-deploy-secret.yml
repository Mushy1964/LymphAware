name: Check Netlify deployment secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify-deploy-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether a Netlify auth secret is configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN_PRESENT=yes"
          else
            echo "NETLIFY_AUTH_TOKEN_PRESENT=no"
          fi
