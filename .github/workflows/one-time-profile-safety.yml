name: One-time profile safety and privacy update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-profile-safety.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply profile safety and privacy wording
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Member profile entry guidance. Detailed warnings live here rather than
          # increasing the height of the public QR profile.
          replace_once(
              'profile-v2/index.html',
              '<form id="profile-form" hidden>\n<div class="profile-card"><h2>About Me</h2>',
              '<form id="profile-form" hidden>\n<div class="privacy-note" style="margin:0 0 20px"><strong>Before you add information:</strong> Your LymphAware QR profile is a communication and identification aid, not a clinical record. Only add information you are comfortable making available to people who scan your card. LymphAware does not clinically verify the information you enter. <strong>Do not enter medication names, doses, schedules or prescribing instructions.</strong> Keep medication information in your official medication list or medical records. <a href="/privacy/" target="_blank" rel="noopener">Read our Privacy information</a>.</div>\n<div class="profile-card"><h2>About Me</h2>'
          )
          replace_once(
              'profile-v2/index.html',
              '<div class="profile-card"><h2>Treatment Considerations</h2><p class="section-hint">Use this section for treatment-related information you would like healthcare professionals or others assisting you to be aware of. Keep it concise and do not use LymphAware as a substitute for medical records or professional advice.</p>',
              '<div class="profile-card"><h2>Treatment Considerations</h2><p class="section-hint">Use this section for brief practical treatment considerations you would like others assisting you to be aware of. Do not enter medication names, doses, schedules or prescribing instructions. LymphAware does not clinically verify this information and the profile must not be used as a medication record or as a substitute for medical records or professional advice.</p>'
          )
          replace_once(
              'profile-v2/index.html',
              '<div class="profile-card"><h2>Emergency Contact</h2><p class="section-hint">Add someone you would like contacted if appropriate. Only include contact details you are comfortable displaying to anyone who scans your LymphAware card.</p>',
              '<div class="profile-card"><h2>Emergency Contact</h2><p class="section-hint">Add someone you would like contacted if appropriate. Before adding their details, make sure they have agreed to their name, relationship and telephone number being stored by LymphAware and displayed to anyone who scans your active QR profile. Please share our <a href="/emergency-contact-privacy/" target="_blank" rel="noopener">Emergency Contact Privacy Information</a> with them.</p>'
          )
          replace_once(
              'profile-v2/index.html',
              '<div class="privacy-note"><strong>Privacy reminder:</strong> Emergency contact details are visible on your QR profile whenever your profile is switched on.</div>',
              '<div class="privacy-note"><strong>Privacy reminder:</strong> Emergency contact details can be seen by anyone who scans your active QR profile. Only add them with the person’s knowledge and agreement.</div>'
          )
          replace_once(
              'profile-v2/index.html',
              '<div class="profile-card"><h2>Additional Information</h2><p class="section-hint">Use this optional section for anything important that does not fit naturally elsewhere. If there is nothing else you want to add, simply leave it blank.</p>',
              '<div class="profile-card"><h2>Additional Information</h2><p class="section-hint">Use this optional section for anything important that does not fit naturally elsewhere. Do not use this section to add medication names, doses, schedules or prescribing instructions. If there is nothing else you want to add, simply leave it blank.</p>'
          )

          # Just-in-time public visibility reminder in the portal.
          replace_once(
              'portal/index.html',
              '            <label class="portal-switch" aria-label="Show my QR profiles"><input id="portal-profile-visible" type="checkbox"><span class="portal-switch-track"></span></label>\n          </div>',
              '            <label class="portal-switch" aria-label="Show my QR profiles"><input id="portal-profile-visible" type="checkbox"><span class="portal-switch-track"></span></label>\n          </div>\n          <p class="field-note"><strong>Before switching your profile on:</strong> anyone with the QR link can view the information you have chosen to display. Preview your profile first and only make it available when you are comfortable sharing that information.</p>'
          )

          # Current multilingual public profile: text only. No CSS, markup, section
          # height or spacing changes are made, preserving the compact profile design.
          replace_once(
              'p-v3/index.html',
              "footer:['About this profile','This information has been chosen by the member to help others understand their lymphoedema and support needs.','It does not replace medical advice or emergency care.']",
              "footer:['About this profile','Profile information is provided by the member and is not clinically verified by LymphAware.','Do not use it as a medication record or substitute for medical advice or emergency care.']"
          )
          replace_once(
              'p-v3/index.html',
              "footer:['À propos de ce profil','Ces informations ont été choisies par le membre pour aider les autres à comprendre son lymphœdème et ses besoins.','Elles ne remplacent pas un avis médical ou les services d’urgence.']",
              "footer:['À propos de ce profil','Les informations de ce profil sont fournies par le membre et ne sont pas vérifiées cliniquement par LymphAware.','Ne l’utilisez pas comme dossier médicamenteux ni comme substitut à un avis médical ou aux soins d’urgence.']"
          )
          replace_once(
              'p-v3/index.html',
              "footer:['Sobre este perfil','Esta información ha sido elegida por el miembro para ayudar a otras personas a comprender su linfedema y sus necesidades de apoyo.','No sustituye el asesoramiento médico ni la atención de emergencia.']",
              "footer:['Sobre este perfil','La información de este perfil la facilita el miembro y LymphAware no la verifica clínicamente.','No la utilice como registro de medicación ni como sustituto del asesoramiento médico o la atención de urgencia.']"
          )
          replace_once(
              'p-v3/index.html',
              "footer:['Über dieses Profil','Diese Informationen wurden vom Mitglied ausgewählt, um anderen zu helfen, das Lymphödem und den Unterstützungsbedarf zu verstehen.','Sie ersetzen weder medizinischen Rat noch eine Notfallversorgung.']",
              "footer:['Über dieses Profil','Die Angaben in diesem Profil stammen vom Mitglied und werden von LymphAware nicht klinisch überprüft.','Nutzen Sie dieses Profil nicht als Medikamentenliste oder als Ersatz für medizinischen Rat oder Notfallversorgung.']"
          )

          # Older public-profile pages receive the same status wording for consistency.
          legacy_old = '<div class="public-footer"><div class="public-footer-heading"><span class="public-footer-icon" aria-hidden="true"><img src="/assets/icons/exclamation.svg" alt="" class="public-footer-icon-image"></span><span>About this LymphAware profile</span></div><p>This profile contains information the patient has chosen to share to help others understand their lymphoedema and any assistance they may need.</p><p>LymphAware supports communication and awareness. It does not provide medical advice or replace assessment or treatment by healthcare professionals.</p></div>'
          legacy_new = '<div class="public-footer"><div class="public-footer-heading"><span class="public-footer-icon" aria-hidden="true"><img src="/assets/icons/exclamation.svg" alt="" class="public-footer-icon-image"></span><span>About this LymphAware profile</span></div><p>Profile information is provided by the member and is not clinically verified by LymphAware.</p><p>Do not use it as a medication record or substitute for medical advice or emergency care.</p></div>'
          replace_once('p-v2/index.html', legacy_old, legacy_new)

          replace_once(
              'p/index.html',
              '''          <p>\n            This profile contains information the patient has chosen to share\n            to help others understand their lymphoedema and any assistance\n            they may need.\n          </p>\n\n          <p>\n            LymphAware supports communication and awareness. It does not\n            provide medical advice or replace assessment or treatment by\n            healthcare professionals.\n          </p>''',
              '''          <p>\n            Profile information is provided by the member and is not\n            clinically verified by LymphAware.\n          </p>\n\n          <p>\n            Do not use it as a medication record or substitute for medical\n            advice or emergency care.\n          </p>'''
          )

          # Help & FAQs.
          replace_once(
              'help/index.html',
              '''          <article class="principle-card">\n            <h3>Is LymphAware a medical record?</h3>\n\n            <p>\n              No. LymphAware is a communication and identification aid. It is not a clinical record and does not replace professional assessment or medical advice.\n            </p>\n          </article>''',
              '''          <article class="principle-card">\n            <h3>Is LymphAware a medical record?</h3>\n\n            <p>\n              No. Information in a LymphAware profile is entered and maintained by the member. LymphAware does not clinically verify or approve it, and the profile does not replace medical records, professional assessment or medical advice.\n            </p>\n          </article>'''
          )
          replace_once(
              'help/index.html',
              '''          <article class="principle-card">\n            <h3>How do I contact LymphAware?</h3>''',
              '''          <article class="principle-card">\n            <h3>Should I add my medication to my LymphAware profile?</h3>\n\n            <p>\n              No. Do not add medication names, doses, schedules or prescribing instructions. Keep medication information in your official medication list or medical records. LymphAware is designed to communicate your lymphoedema, practical needs and relevant considerations, not to act as a medication record.\n            </p>\n          </article>\n\n\n          <article class="principle-card">\n            <h3>Can I add an emergency contact?</h3>\n\n            <p>\n              Yes, but only add the person’s details after they have agreed to their name and telephone number being stored by LymphAware and displayed on your active QR profile. Please share our <a href="/emergency-contact-privacy/">Emergency Contact Privacy Information</a> with them.\n            </p>\n          </article>\n\n\n          <article class="principle-card">\n            <h3>How do I contact LymphAware?</h3>'''
          )

          # Terms: patient-entered information and current automated translation model.
          replace_once(
              'terms/index.html',
              '''            <p>\n              LymphAware does not provide medical diagnosis and does not\n              replace professional medical advice, assessment or appropriate\n              clinical care.\n            </p>''',
              '''            <p>\n              Information in a member’s QR profile is provided by the member\n              and is not clinically verified or approved by LymphAware.\n              LymphAware does not provide medical diagnosis and does not\n              replace medical records, professional medical advice, assessment\n              or appropriate clinical care.\n            </p>'''
          )
          availability_marker = '''    <section class="content-section privacy-section">\n      <div class="container split-section">\n\n        <div class="split-copy">\n\n          <h2>Availability</h2>'''
          profile_terms = '''    <section class="content-section">\n      <div class="container split-section">\n        <div class="split-copy">\n          <h2>Information you add to your profile</h2>\n          <p>Members are responsible for keeping the information they enter accurate and reasonably up to date. LymphAware does not clinically verify, approve or endorse member-entered health information.</p>\n          <p>LymphAware is not intended to be a medication record. Members are asked not to enter medication names, doses, schedules or prescribing instructions. If medication information is entered despite this guidance, it remains member-provided information and must not be treated as clinically verified or as the sole source for treatment decisions.</p>\n        </div>\n        <div class="highlight-box">\n          <h3>Emergency contacts</h3>\n          <p>Only add another person as an emergency contact with their knowledge and agreement. Their name, relationship and telephone number may be displayed to anyone who accesses an active QR profile. Members should share the <a href="/emergency-contact-privacy/">Emergency Contact Privacy Information</a> with them.</p>\n        </div>\n      </div>\n    </section>\n\n\n''' + availability_marker
          replace_once('terms/index.html', availability_marker, profile_terms)

          replace_once(
              'terms/index.html',
              '''          <p>\n            Customers do not need to translate their own information.\n            Where an additional-language package has been purchased and\n            explicit agreement has been given, LymphAware uses an automated\n            translation service to prepare a draft from the main English\n            profile.\n          </p>\n          <p>\n            A LymphAware administrator checks the draft before it can be\n            published. Automated translation supports the service but may\n            require correction, so customers should keep their main English\n            profile accurate and contact LymphAware if translated information\n            appears incorrect.\n          </p>''',
              '''          <p>\n            Customers do not need to translate their own information.\n            Where an additional-language package has been purchased and\n            explicit agreement has been given, LymphAware uses an automated\n            translation service to prepare and automatically maintain the\n            translated version from the main English profile.\n          </p>\n          <p>\n            Translation is prepared automatically and is not presented as a\n            clinical or professional translation. Customers should keep their\n            main English profile accurate and contact LymphAware if translated\n            wording appears incorrect.\n          </p>'''
          )
          replace_once(
              'terms/index.html',
              '''          <p>\n            Empty English fields remain empty in the translated profile.\n            Updating the English profile may cause the translated profile to\n            be held temporarily while a revised draft is reviewed.\n          </p>''',
              '''          <p>\n            Empty English fields remain empty in the translated profile.\n            When the English profile is updated, the translated version may\n            be refreshed automatically; its current version can remain\n            available while the refreshed version is prepared.\n          </p>'''
          )

          # Privacy page: concrete QR-profile and emergency-contact transparency.
          privacy_marker = '''  \n    <section class="content-section privacy-section">\n      <div class="container split-section">\n        <div class="split-copy">\n          <p class="eyebrow">Additional Languages</p>'''
          privacy_section = '''  \n    <section class="content-section">\n      <div class="container split-section">\n        <div class="split-copy">\n          <p class="eyebrow">QR-linked profiles</p>\n          <h2>Health information you choose to make available</h2>\n          <p>A LymphAware profile can contain information about lymphoedema and related needs. Members should only add information that is relevant to the purpose of the profile and that they are comfortable making available to people who scan their card.</p>\n          <p>When a QR profile is switched on, anyone who has the QR link can view the information selected for display. Members can preview their profile, update it and switch QR-profile visibility off from the Patient Portal.</p>\n          <p>LymphAware does not clinically verify member-entered information and asks members not to use the profile to record medication names, doses, schedules or prescribing instructions.</p>\n        </div>\n        <div class="highlight-box">\n          <h3>Emergency contact information</h3>\n          <p>An emergency contact’s name and telephone number relate to another person. Members are asked to obtain that person’s agreement before adding their details and to share our <a href="/emergency-contact-privacy/">Emergency Contact Privacy Information</a>.</p>\n          <p>Emergency contact details are displayed only as part of the member’s active QR profile and can be removed or changed by the member.</p>\n        </div>\n      </div>\n    </section>\n\n''' + privacy_marker
          replace_once('privacy/index.html', privacy_marker, privacy_section)

          # Dedicated emergency-contact privacy information page.
          emergency_page = '''<!DOCTYPE html>\n<html lang="en-GB">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Emergency Contact Privacy Information | LymphAware</title>\n  <link rel="stylesheet" href="/css/styles.css">\n  <link rel="stylesheet" href="/css/secondary-header.css">\n</head>\n<body>\n<header class="site-header secondary-header"><div class="container header-inner"><a href="/" class="header-brand" aria-label="Back to LymphAware website"><img class="header-logo" src="/assets/brand/LymphAware_APPROVED_With_Tagline_v1.svg" alt="LymphAware – Helping People Living with Lymphoedema Be Understood"></a><div class="header-actions"><a href="/" class="button button-secondary back-to-website-button">Back to Website</a></div></div></header>\n<main>\n<section class="page-hero"><div class="container"><div class="page-hero-inner"><p class="eyebrow">Privacy information</p><h1>If you have been named as a LymphAware emergency contact.</h1><p>This page explains why your contact details may appear on another person’s LymphAware QR profile.</p></div></div></section>\n<section class="content-section"><div class="container split-section"><div class="split-copy"><h2>Why LymphAware may hold your details</h2><p>A LymphAware member can choose to add an emergency contact to their QR-linked profile. If you have been named, the information was provided by that member rather than collected from you directly.</p><p>The information is limited to the contact details the member has chosen to provide, such as your name, relationship to them and telephone number. LymphAware does not need you to provide medical information about yourself in order to be an emergency contact.</p></div><div class="highlight-box"><h3>How the details are used</h3><p>The purpose is to allow someone assisting the LymphAware member to know who the member has nominated as an emergency contact and, where appropriate, to contact that person.</p><p>While the member’s QR profile is switched on, those contact details may be visible to anyone who accesses that profile through its QR link.</p></div></div></section>\n<section class="content-section privacy-section"><div class="container split-section"><div class="split-copy"><h2>Your choice matters</h2><p>LymphAware asks members to tell their emergency contact before adding the person’s details and to obtain their agreement to those details being stored and displayed on the active QR profile.</p><p>If you no longer want your details to appear, you can ask the LymphAware member to remove or change them. You can also contact LymphAware at <a href="mailto:admin@lymphaware.com">admin@lymphaware.com</a> if you need help or have a privacy question.</p></div><div class="highlight-box"><h3>More privacy information</h3><p>This page provides additional information specifically for emergency contacts. Please also read the main <a href="/privacy/">LymphAware Privacy &amp; Data Protection</a> page for information about how the service approaches personal information.</p></div></div></section>\n</main>\n<footer><div class="container"><div class="footer-grid"><div class="footer-brand"><img class="footer-logo" src="/assets/brand/LymphAware_APPROVED_No_Tagline_Centred_v1.svg" alt="LymphAware"><p>Helping People Living with Lymphoedema Be Understood.</p></div><div class="footer-links"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/contact/">Contact</a></div></div><div class="footer-note">LymphAware is a communication and identification aid. It does not provide medical diagnosis or replace professional medical advice.</div></div></footer>\n</body>\n</html>\n'''
          target = Path('emergency-contact-privacy/index.html')
          target.parent.mkdir(parents=True, exist_ok=True)
          if target.exists():
              raise SystemExit('emergency-contact-privacy/index.html already exists')
          target.write_text(emergency_page, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add profile-v2/index.html portal/index.html p-v3/index.html p-v2/index.html p/index.html help/index.html terms/index.html privacy/index.html emergency-contact-privacy/index.html
          git commit -m "Strengthen profile safety and privacy guidance"
          git push
