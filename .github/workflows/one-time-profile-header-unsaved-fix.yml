name: One-time profile header and unsaved changes fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-profile-header-unsaved-fix.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten unsaved validation handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('profile-v2/index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "if(!displayName){setStatus('Please enter your display name before saving your profile.','error');$('display-name').focus();return}"
          new1 = "if(!displayName){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please enter your display name before saving your profile.','error');$('display-name').focus();return}"
          old2 = "if(!photoPath&&!file){setStatus('Please choose a photograph before saving your profile.','error');$('photo-input').focus();return}"
          new2 = "if(!photoPath&&!file){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please choose a photograph before saving your profile.','error');$('photo-input').focus();return}"
          if old1 not in s or old2 not in s:
              raise SystemExit('Validation markers not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-v2/index.html
          git commit -m "Handle unsaved warning validation cleanly"
          git push
