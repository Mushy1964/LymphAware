name: One-time language fulfilment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-language-fulfilment.yml'

permissions:
  contents: write

jobs:
  update-language-fulfilment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update language fulfilment display
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: language package includes one lanyard/holder per language card,
          # and primary job knows whether the language card has reached production.
          path = Path('netlify/functions/card-production-list.mjs')
          s = path.read_text(encoding='utf-8')

          old = """    const primaryJobs = (primaryProfiles || []).map(profile => ({\n      ...profile,\n      record_type: 'PRIMARY',\n      language_code: 'EN',\n      language_name: 'English',\n      fulfilment: fulfilmentByUser.get(profile.user_id) || {\n        order_numbers: [],\n        card_copies: 1,\n        lanyard_holders: 1,\n        language_packages: []\n      }\n    }));"""
          new = """    const activeLanguageKeys = new Set(\n      (languageProfiles || []).map(row =>\n        `${row.user_id || ''}|${String(row.language_name || '').trim().toLowerCase()}`\n      )\n    );\n\n    const primaryJobs = (primaryProfiles || []).map(profile => {\n      const baseFulfilment = fulfilmentByUser.get(profile.user_id) || {\n        order_numbers: [],\n        card_copies: 1,\n        lanyard_holders: 1,\n        language_packages: []\n      };\n\n      return {\n        ...profile,\n        record_type: 'PRIMARY',\n        language_code: 'EN',\n        language_name: 'English',\n        fulfilment: {\n          ...baseFulfilment,\n          language_packages: (baseFulfilment.language_packages || []).map(item => ({\n            ...item,\n            setup_complete: activeLanguageKeys.has(\n              `${profile.user_id || ''}|${String(item.language_name || '').trim().toLowerCase()}`\n            )\n          }))\n        }\n      };\n    });"""
          if old not in s:
              raise SystemExit('Primary jobs pattern not found')
          s = s.replace(old, new, 1)

          old = """          card_copies: quantity,\n          lanyard_holders: 0,"""
          new = """          card_copies: quantity,\n          lanyard_holders: quantity,"""
          if old not in s:
              raise SystemExit('Language lanyard pattern not found')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')

          # Admin UI: if the language job is already ready/prepared, stop saying setup required.
          path = Path('admin/card-production/index.html')
          s = path.read_text(encoding='utf-8')

          old = """    const languageSummary = languagePackages.length\n      ? languagePackages\n          .map(item => `${escapeHtml(item.language_name || 'Language not specified')} × ${Number(item.quantity || 0)}`)\n          .join(', ')\n      : '';"""
          new = """    const languageSummary = languagePackages.length\n      ? languagePackages\n          .map(item => `${escapeHtml(item.language_name || 'Language not specified')} × ${Number(item.quantity || 0)}`)\n          .join(', ')\n      : '';\n\n    const completedLanguageSummary = languagePackages.length\n      ? languagePackages\n          .filter(item => item.setup_complete === true)\n          .map(item => `${escapeHtml(item.language_name || 'Language')} × ${Number(item.quantity || 0)}`)\n          .join(', ')\n      : '';\n\n    const pendingLanguageSummary = languagePackages.length\n      ? languagePackages\n          .filter(item => item.setup_complete !== true)\n          .map(item => `${escapeHtml(item.language_name || 'Language')} × ${Number(item.quantity || 0)}`)\n          .join(', ')\n      : '';"""
          if old not in s:
              raise SystemExit('Language summary setup pattern not found')
          s = s.replace(old, new, 1)

          old = """        ${profile.record_type === 'LANGUAGE'\n          ? `<div class=\"production-language-note\">Additional-language card ready: ${escapeHtml(profile.language_name || 'Language')} (${escapeHtml(profile.language_code || '')}).</div>`\n          : languageSummary\n            ? `<div class=\"production-language-note\">Additional language package: ${languageSummary} — separate language card/profile setup required.</div>`\n            : ''}"""
          new = """        ${profile.record_type === 'LANGUAGE'\n          ? `<div class=\"production-language-note\">Additional-language card ready: ${escapeHtml(profile.language_name || 'Language')} (${escapeHtml(profile.language_code || '')}).</div>`\n          : completedLanguageSummary\n            ? `<div class=\"production-language-note\">Additional language card ready: ${completedLanguageSummary} — see the separate language card job.</div>`\n            : pendingLanguageSummary\n              ? `<div class=\"production-language-note\">Additional language package: ${pendingLanguageSummary} — language card/profile setup still required.</div>`\n              : ''}"""
          if old not in s:
              raise SystemExit('Language note pattern not found')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/card-production-list.mjs admin/card-production/index.html
          git commit -m "Refine additional language fulfilment"
          git push
