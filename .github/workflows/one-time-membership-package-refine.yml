name: One-time membership package refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-membership-package-refine.yml'

permissions:
  contents: write

jobs:
  refine-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine membership package presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_lines = [
              '    /* Bronze / Silver / Gold membership tiers */',
              '    .home-membership-packages .home-membership-price-card { position: relative; overflow: hidden; border-width: 1px; border-top-width: 6px; transition: transform .16s ease, box-shadow .16s ease; }',
              '    .home-membership-packages .home-membership-price-card:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(31, 47, 66, 0.11); }',
              '    .home-membership-tier-bronze { border-color: #b88663; background: linear-gradient(180deg, #fffaf6 0%, #ffffff 34%); }',
              '    .home-membership-tier-silver { border-color: #aab4be; background: linear-gradient(180deg, #f8fafc 0%, #ffffff 34%); }',
              '    .home-membership-tier-gold { border-color: #d2ac4d; background: linear-gradient(180deg, #fffaf0 0%, #ffffff 34%); box-shadow: 0 16px 36px rgba(149, 111, 20, 0.11); }',
              '    .home-membership-packages .home-membership-package-badge { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-width: 72px; min-height: 30px; margin: 0 0 14px; padding: 5px 12px; border-radius: 999px; font-size: .82rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }',
              '    .home-membership-tier-bronze .home-membership-package-badge { background: #f2e3d8; color: #87502f; }',
              '    .home-membership-tier-silver .home-membership-package-badge { background: #e9edf1; color: #566370; }',
              '    .home-membership-tier-gold .home-membership-package-badge { background: #f7eac4; color: #8a650c; }',
              '    .home-membership-tier-bronze .home-membership-price { color: #9a5d37; }',
              '    .home-membership-tier-silver .home-membership-price { color: #667481; }',
              '    .home-membership-tier-gold .home-membership-price { color: #a77a0d; }',
              '    .home-membership-packages .home-membership-price-label { display: flex; align-items: flex-end; min-height: 30px; }'
          ]
          old_css = '\n'.join(old_lines)
          new_lines = [
              '    /* Distinct LymphAware membership packages */',
              '    .home-membership-packages .home-membership-price-card { position: relative; overflow: hidden; border-width: 1px; border-top-width: 6px; transition: transform .16s ease, box-shadow .16s ease; }',
              '    .home-membership-packages .home-membership-price-card:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(31, 47, 66, 0.11); }',
              '    .home-membership-package-standard { border-color: #72aa7f; background: linear-gradient(180deg, #f7fbf8 0%, #ffffff 34%); }',
              '    .home-membership-package-plus { border-color: #6f9fc5; background: linear-gradient(180deg, #f6fafe 0%, #ffffff 34%); }',
              '    .home-membership-package-multilingual { border-color: #4f9290; background: linear-gradient(180deg, #f5fbfa 0%, #ffffff 34%); box-shadow: 0 16px 36px rgba(31, 91, 96, 0.09); }',
              '    .home-membership-packages .home-membership-package-badge { display: inline-flex; align-items: center; align-self: flex-start; min-height: 32px; margin: 0 0 12px; padding: 6px 12px; border-radius: 999px; font-size: .88rem; font-weight: 800; letter-spacing: 0; text-transform: none; }',
              '    .home-membership-package-standard .home-membership-package-badge { background: #e9f5ec; color: #16853f; }',
              '    .home-membership-package-plus .home-membership-package-badge { background: #eaf3fa; color: #1768b0; }',
              '    .home-membership-package-multilingual .home-membership-package-badge { background: linear-gradient(90deg, #eaf6ed, #eaf3fa); color: #246b70; }',
              '    .home-membership-package-summary { display: flex; align-items: flex-start; min-height: 48px; margin: 0 0 8px; color: #536273; font-size: .98rem; line-height: 1.45; }',
              '    .home-membership-package-standard .home-membership-price { color: #16853f; }',
              '    .home-membership-package-plus .home-membership-price { color: #1768b0; }',
              '    .home-membership-package-multilingual .home-membership-price { color: #287c7a; }'
          ]
          new_css = '\n'.join(new_lines)
          if old_css not in s:
              raise SystemExit('Existing membership tier CSS block not found')
          s = s.replace(old_css, new_css, 1)
          s = s.replace('<article class="home-membership-price-card home-membership-tier-bronze">\n          <p class="home-membership-package-badge">Bronze</p>\n          <p class="home-membership-price-label">5-Year Membership</p>\n          <p class="home-membership-price">£29.99</p>', '<article class="home-membership-price-card home-membership-package-standard">\n          <p class="home-membership-package-badge">5-Year Membership</p>\n          <p class="home-membership-package-summary">The essential LymphAware package.</p>\n          <p class="home-membership-price">£29.99</p>', 1)
          s = s.replace('<article class="home-membership-price-card home-membership-tier-silver">\n          <p class="home-membership-package-badge">Silver</p>\n          <p class="home-membership-price-label">5-Year Plus</p>\n          <p class="home-membership-price">£39.99</p>', '<article class="home-membership-price-card home-membership-package-plus">\n          <p class="home-membership-package-badge">5-Year Plus</p>\n          <p class="home-membership-package-summary">Extra flexibility for everyday use.</p>\n          <p class="home-membership-price">£39.99</p>', 1)
          s = s.replace('<article class="home-membership-price-card home-membership-tier-gold">\n          <p class="home-membership-package-badge">Gold</p>\n          <p class="home-membership-price-label">5-Year Multilingual</p>\n          <p class="home-membership-price">£49.99</p>', '<article class="home-membership-price-card home-membership-package-multilingual">\n          <p class="home-membership-package-badge">5-Year Multilingual</p>\n          <p class="home-membership-package-summary">For people who use LymphAware in more than one language setting.</p>\n          <p class="home-membership-price">£49.99</p>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine membership package labels and descriptions"
          git push
