name: One-time consent and privacy UI update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-consent-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply consent and emergency-contact controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('profile-v2/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '</style>',
              '''.consent-card{border:1px solid #cfe0e8;background:#f7fbfd}.consent-check{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border:1px solid #cbd8df;border-radius:12px;background:#fff;color:#263746;line-height:1.5}.consent-check input{width:20px!important;height:20px;flex:0 0 20px;margin-top:2px}.consent-recorded{padding:14px 16px;border:1px solid #c8ddd0;border-radius:12px;background:#eef7f0;color:#28563a;line-height:1.5}.consent-actions{margin-top:14px}.consent-withdraw-note{margin:9px 0 0;color:#687785;font-size:.84rem;line-height:1.45}.emergency-confirm{display:flex;align-items:flex-start;gap:10px;margin-top:12px}.emergency-confirm input{width:20px!important;height:20px;flex:0 0 20px;margin-top:2px}\n</style>'''
          )

          replace_once(
              '<div class="privacy-note"><strong>Privacy reminder:</strong> Emergency contact details can be seen by anyone who scans your active QR profile. Only add them with the person’s knowledge and agreement.</div>',
              '''<div class="privacy-note"><strong>Privacy reminder:</strong> Emergency contact details can be seen by anyone who scans your active QR profile. Only add them with the person’s knowledge and agreement.<label class="emergency-confirm"><input id="emergency-contact-confirmation" type="checkbox"><span>I confirm that I have shown or sent the <a href="/emergency-contact-privacy/" target="_blank" rel="noopener">Emergency Contact Privacy Information</a> to this person and that they know and agree that these contact details will be stored by LymphAware and may be displayed on my active QR profile.</span></label></div>'''
          )

          replace_once(
              '<div class="profile-actions"><button type="submit" class="button button-primary" id="save-button">Save Changes</button><a class="button button-secondary" href="/preview/">Preview My QR Profile</a></div>',
              '''<div class="profile-card consent-card" id="health-consent-card"><h2>Health information &amp; your consent</h2><p class="section-hint">Your name and photograph can be saved without health-data consent. Before LymphAware stores health information in this profile or makes a QR-linked health profile public, we need your explicit consent. This consent is separate from your membership and you can withdraw it at any time.</p><div id="health-consent-needed"><label class="consent-check"><input id="health-consent-checkbox" type="checkbox"><span><strong>I explicitly consent</strong> to LymphAware processing the health information I choose to enter in this profile and making that information available through my QR-linked profile when I switch it on. I understand that anyone with the QR link can view it, that LymphAware does not clinically verify it, and that I can withdraw this consent at any time.</span></label><p class="field-help">Read the <a href="/privacy/" target="_blank" rel="noopener">LymphAware Privacy Notice</a> before giving consent.</p></div><div id="health-consent-recorded" class="consent-recorded" hidden></div><div id="health-consent-withdraw-actions" class="consent-actions" hidden><button type="button" id="withdraw-health-consent" class="button button-secondary">Withdraw health-data consent</button><p class="consent-withdraw-note">Withdrawing consent will switch off your QR profiles and permanently remove the health, assistance, emergency-contact and translated profile information stored for your profile. Your account, membership, photograph and LymphAware ID will remain.</p></div></div>\n<div class="profile-actions"><button type="submit" class="button button-primary" id="save-button">Save Changes</button><a class="button button-secondary" href="/preview/">Preview My QR Profile</a></div>'''
          )

          replace_once(
              "const SUPABASE_URL='https://thbhsktcenhrnxzkbjus.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);",
              "const SUPABASE_URL='https://thbhsktcenhrnxzkbjus.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);\nconst HEALTH_CONSENT_VERSION='2026-09-09-v1';\nconst HEALTH_CONSENT_STATEMENT='I explicitly consent to LymphAware processing the health information I choose to enter in this profile and making that information available through my QR-linked profile when I switch it on. I understand that anyone with the QR link can view it, that LymphAware does not clinically verify it, and that I can withdraw this consent at any time.';\nconst EMERGENCY_NOTICE_VERSION='2026-09-09-v1';\nconst EMERGENCY_NOTICE_STATEMENT='I confirm that I have shown or sent the Emergency Contact Privacy Information to this person and that they know and agree that these contact details will be stored by LymphAware and may be displayed on my active QR profile.';"
          )

          replace_once(
              "const iconFiles={standing:'standing.png',seating:'seating.png',time:'extra-time.png',mobility:'mobility.png','extra-space':'extra-space.png',understanding:'understanding.png'};let user=null,profile=null,assistanceOptions=[];const $=id=>document.getElementById(id);",
              "const iconFiles={standing:'standing.png',seating:'seating.png',time:'extra-time.png',mobility:'mobility.png','extra-space':'extra-space.png',understanding:'understanding.png'};let user=null,profile=null,assistanceOptions=[],healthConsentActive=false,healthConsentAt=null,emergencyNoticeCurrent=false,initialEmergencyKey='';const $=id=>document.getElementById(id);"
          )

          replace_once(
              "function text(id){return $(id).value.trim()||null}function setStatus(message,type='success'){const el=$('status');el.className=`status-message ${type}`;el.textContent=message;el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'nearest'})}",
              """function text(id){return $(id).value.trim()||null}function setStatus(message,type='success'){const el=$('status');el.className=`status-message ${type}`;el.textContent=message;el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'nearest'})}\nfunction emergencyKey(name,relationship,phone){return `${String(name||'').trim().toLowerCase()}|${String(relationship||'').trim().toLowerCase()}|${String(phone||'').replace(/[^0-9+]/g,'')}`}\nfunction emergencyKeyFromForm(){return emergencyKey($('emergency-name').value,$('emergency-relationship').value,$('emergency-phone').value)}\nfunction selectedAssistanceIds(){return [...document.querySelectorAll('input[data-assistance=\\\"1\\\"]:checked')].map(cb=>Number(cb.value))}\nfunction healthContentPresent(selected=selectedAssistanceIds()){return Boolean(text('lymph-type')||text('lymph-location')||text('compression')||text('treatment')||text('assistance-notes')||text('additional')||selected.length)}\nfunction showConsentState(){const needed=$('health-consent-needed'),recorded=$('health-consent-recorded'),actions=$('health-consent-withdraw-actions');if(profile?.is_demo){needed.hidden=true;recorded.hidden=false;recorded.textContent='This is a fictional demonstration profile, so a patient health-data consent record is not required.';actions.hidden=true;return}needed.hidden=healthConsentActive;recorded.hidden=!healthConsentActive;actions.hidden=!healthConsentActive;if(healthConsentActive){const when=healthConsentAt?new Date(healthConsentAt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'recorded';recorded.textContent=`Your explicit health-data consent is active (${when}). You remain in control of what you enter and whether your QR profile is shown.`}}\nasync function loadPrivacyState(){if(profile?.is_demo){healthConsentActive=true;healthConsentAt=null;emergencyNoticeCurrent=true;showConsentState();return}const {data:events,error}=await supabaseClient.from('profile_privacy_events').select('id,event_type,created_at,version').eq('profile_id',profile.id).in('event_type',['HEALTH_CONSENT_GRANTED','HEALTH_CONSENT_WITHDRAWN']).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(1);if(error)console.error('Unable to load health consent status:',error);const latest=events?.[0];healthConsentActive=latest?.event_type==='HEALTH_CONSENT_GRANTED';healthConsentAt=healthConsentActive?latest.created_at:null;const {data:notice,error:noticeError}=await supabaseClient.rpc('has_current_emergency_contact_notice',{p_profile_id:profile.id});if(noticeError)console.error('Unable to load emergency-contact privacy status:',noticeError);emergencyNoticeCurrent=notice===true;const confirm=$('emergency-contact-confirmation');if(confirm)confirm.checked=emergencyNoticeCurrent&&emergencyKeyFromForm()===initialEmergencyKey;showConsentState()}\nasync function grantHealthConsent(){const {data,error}=await supabaseClient.rpc('grant_profile_health_consent',{p_profile_id:profile.id,p_version:HEALTH_CONSENT_VERSION,p_statement:HEALTH_CONSENT_STATEMENT});if(error)throw error;healthConsentActive=true;healthConsentAt=data;showConsentState()}\nasync function confirmEmergencyNotice(fields){const {error}=await supabaseClient.rpc('confirm_emergency_contact_notice',{p_profile_id:profile.id,p_name:fields.name,p_relationship:fields.relationship,p_phone:fields.phone,p_version:EMERGENCY_NOTICE_VERSION,p_statement:EMERGENCY_NOTICE_STATEMENT});if(error)throw error;emergencyNoticeCurrent=true}"""
          )

          replace_once(
              "$('display-name').value=p.display_name||'';$('lymphaware-id').textContent=p.lymphaware_id||'Pending';$('lymph-type').value=p.lymphoedema_type||'';$('lymph-location').value=p.lymphoedema_location||'';$('compression').value=p.compression_information||'';$('treatment').value=p.treatment_considerations||'';$('assistance-notes').value=p.assistance_needs||'';$('emergency-name').value=p.emergency_contact_name||'';$('emergency-relationship').value=p.emergency_contact_relationship||'';$('emergency-phone').value=p.emergency_contact_phone||'';$('additional').value=p.additional_statement||'';await renderPhoto(p.photo_path);renderAssistance(selectedIds);$('loading').hidden=true;$('profile-form').hidden=false}",
              "$('display-name').value=p.display_name||'';$('lymphaware-id').textContent=p.lymphaware_id||'Pending';$('lymph-type').value=p.lymphoedema_type||'';$('lymph-location').value=p.lymphoedema_location||'';$('compression').value=p.compression_information||'';$('treatment').value=p.treatment_considerations||'';$('assistance-notes').value=p.assistance_needs||'';$('emergency-name').value=p.emergency_contact_name||'';$('emergency-relationship').value=p.emergency_contact_relationship||'';$('emergency-phone').value=p.emergency_contact_phone||'';$('additional').value=p.additional_statement||'';await renderPhoto(p.photo_path);renderAssistance(selectedIds);initialEmergencyKey=emergencyKeyFromForm();await loadPrivacyState();$('loading').hidden=true;$('profile-form').hidden=false}"
          )

          old_submit_start = "$('profile-form').addEventListener('submit',async e=>{e.preventDefault();$('status').hidden=true;const displayName=$('display-name').value.trim();if(!displayName){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please enter your display name before saving your profile.','error');$('display-name').focus();return}let photoPath=profile.photo_path||null;const file=$('photo-input').files?.[0];if(!photoPath&&!file){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please choose a photograph before saving your profile.','error');$('photo-input').focus();return}$('save-button').disabled=true;try{if(file){"
          new_submit_start = """$('profile-form').addEventListener('submit',async e=>{e.preventDefault();$('status').hidden=true;const displayName=$('display-name').value.trim();if(!displayName){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please enter your display name before saving your profile.','error');$('display-name').focus();return}let photoPath=profile.photo_path||null;const file=$('photo-input').files?.[0];if(!photoPath&&!file){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please choose a photograph before saving your profile.','error');$('photo-input').focus();return}const selected=selectedAssistanceIds();const healthContent=healthContentPresent(selected);if(profile?.is_demo!==true&&!healthConsentActive&&healthContent&&!$('health-consent-checkbox').checked){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Please read and tick the explicit health-data consent statement before saving health information to your LymphAware profile.','error');$('health-consent-checkbox').focus();return}const emergencyFields={name:$('emergency-name').value.trim(),relationship:$('emergency-relationship').value.trim(),phone:$('emergency-phone').value.trim()};const hasEmergency=Boolean(emergencyFields.name||emergencyFields.relationship||emergencyFields.phone);if(hasEmergency&&(!emergencyFields.name||!emergencyFields.phone)){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('If you add an emergency contact, please include both their name and telephone number.','error');return}const currentEmergencyKey=emergencyKey(emergencyFields.name,emergencyFields.relationship,emergencyFields.phone);const emergencyChanged=currentEmergencyKey!==initialEmergencyKey;if(hasEmergency&&(emergencyChanged||!emergencyNoticeCurrent)&&!$('emergency-contact-confirmation').checked){pendingNavigationUrl=null;$('unsaved-save').disabled=false;setStatus('Before saving an emergency contact, please confirm that you have shown or sent them the Emergency Contact Privacy Information and that they know and agree to their details being added.','error');$('emergency-contact-confirmation').focus();return}$('save-button').disabled=true;try{if(profile?.is_demo!==true&&!healthConsentActive&&$('health-consent-checkbox').checked){await grantHealthConsent()}if(hasEmergency&&(emergencyChanged||!emergencyNoticeCurrent)){await confirmEmergencyNotice(emergencyFields)}if(file){"""
          replace_once(old_submit_start, new_submit_start)

          replace_once(
              "const selected=[...document.querySelectorAll('input[data-assistance=\"1\"]:checked')].map(cb=>Number(cb.value));const {error:deleteError}=await supabaseClient.from('profile_assistance').delete().eq('profile_id',profile.id);",
              "const {error:deleteError}=await supabaseClient.from('profile_assistance').delete().eq('profile_id',profile.id);"
          )

          replace_once(
              "profile={...profile,...payload};await renderPhoto(photoPath);$('photo-input').value='';unsavedChanges=false;setStatus('Your LymphAware profile has been saved. Any additional-language profile will now update automatically; its current version remains available while the update is prepared.');",
              "profile={...profile,...payload};initialEmergencyKey=currentEmergencyKey;emergencyNoticeCurrent=!hasEmergency||true;if($('emergency-contact-confirmation'))$('emergency-contact-confirmation').checked=hasEmergency;await renderPhoto(photoPath);$('photo-input').value='';unsavedChanges=false;showConsentState();setStatus('Your LymphAware profile has been saved. Any additional-language profile will now update automatically; its current version remains available while the update is prepared.');"
          )

          replace_once(
              "let unsavedChanges=false;",
              """$('emergency-name').addEventListener('input',()=>{if(emergencyKeyFromForm()!==initialEmergencyKey){emergencyNoticeCurrent=false;$('emergency-contact-confirmation').checked=false}});$('emergency-relationship').addEventListener('input',()=>{if(emergencyKeyFromForm()!==initialEmergencyKey){emergencyNoticeCurrent=false;$('emergency-contact-confirmation').checked=false}});$('emergency-phone').addEventListener('input',()=>{if(emergencyKeyFromForm()!==initialEmergencyKey){emergencyNoticeCurrent=false;$('emergency-contact-confirmation').checked=false}});\n$('withdraw-health-consent').addEventListener('click',async()=>{if(!healthConsentActive||profile?.is_demo===true)return;const first=confirm('Withdrawing consent will switch off your QR profiles and permanently remove the health, assistance, emergency-contact and translated information stored in your profile. Your account, membership, photograph and LymphAware ID will remain. Do you want to continue?');if(!first)return;const second=confirm('This removal cannot be undone. Withdraw your health-data consent and remove the profile information now?');if(!second)return;const button=$('withdraw-health-consent');button.disabled=true;try{const {error}=await supabaseClient.rpc('withdraw_profile_health_consent',{p_profile_id:profile.id,p_version:HEALTH_CONSENT_VERSION,p_statement:'I withdraw my explicit consent for LymphAware to process the health information in my QR-linked profile and request removal of that profile information.'});if(error)throw error;alert('Your health-data consent has been withdrawn. Your QR profiles are switched off and the stored health-profile information has been removed.');location.reload()}catch(error){console.error(error);setStatus('Your consent could not be withdrawn. Please try again or contact LymphAware.','error');button.disabled=false}});\nlet unsavedChanges=false;"""
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add profile-v2/index.html
          git commit -m "Add explicit health consent and emergency contact privacy controls"
          git push
