name: One-time consent UI cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-consent-ui.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tidy consent UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('profile-v2/index.html')
          s = p.read_text(encoding='utf-8')
          old = "emergencyNoticeCurrent=!hasEmergency||true;"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one emergency notice state expression, found {s.count(old)}')
          s = s.replace(old, "emergencyNoticeCurrent=true;", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add profile-v2/index.html
          git commit -m "Tidy profile privacy consent state handling"
          git push
