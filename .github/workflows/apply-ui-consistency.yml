name: Apply LymphAware UI consistency

on:
  push:
    paths:
      - '.github/workflows/apply-ui-consistency.yml'

permissions:
  contents: write

jobs:
  update-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add central logo and button consistency rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('css/styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* LYMPHAWARE GLOBAL UI CONSISTENCY */'

          block = r'''

/* LYMPHAWARE GLOBAL UI CONSISTENCY */
/* Keep page width stable when accordions/content change height. */
html {
  scrollbar-gutter: stable;
}

/* Use one readable button type size throughout the site. */
.button,
button.button,
a.button,
input.button,
.mobile-menu summary {
  font-size: 1rem !important;
  line-height: 1.2 !important;
}

/* Keep all standard site/account header logos the same size and position. */
.site-header .header-inner {
  width: min(1180px, calc(100% - 40px)) !important;
  max-width: 1180px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

.site-header .header-logo {
  width: 300px !important;
  max-width: 100% !important;
  height: auto !important;
}

/* The scanner/preview profile uses a centred logo rather than the site header. */
.public-brand-logo {
  width: 100% !important;
  max-width: 430px !important;
  height: auto !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

@media (max-width: 680px) {
  .site-header .header-inner {
    width: min(100% - 28px, 1180px) !important;
    gap: 12px !important;
  }

  .site-header .header-logo {
    width: 220px !important;
    max-width: calc(100vw - 170px) !important;
  }

  .button,
  button.button,
  a.button,
  input.button,
  .mobile-menu summary {
    font-size: 1rem !important;
    min-height: 44px;
  }

  .public-brand-logo {
    max-width: 360px !important;
  }
}
'''

          if marker not in css:
              path.write_text(css.rstrip() + block + '\n', encoding='utf-8')

      - name: Commit consistency update
        run: |
          if git diff --quiet; then
            echo "No change required"
            exit 0
          fi
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add css/styles.css
          git commit -m "Standardise logo positioning and button typography"
          git push
