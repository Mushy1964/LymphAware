name: Generate package lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-package-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add deterministic npm dependency lockfile"
          git push
