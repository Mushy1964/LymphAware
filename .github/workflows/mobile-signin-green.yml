name: Mobile sign in green

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-signin-green.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile sign in colours
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/public-chrome.css')
          css = p.read_text(encoding='utf-8')
          css = css.replace('background: #eaf6ed;\n    color: #2b6f39;', 'background: #2f9a44;\n    color: #ffffff;', 1)
          css = css.replace('background: #dff1e4;\n    color: #245f31;', 'background: #27833a;\n    color: #ffffff;', 1)
          p.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Use logo green for mobile sign in"
          git push
