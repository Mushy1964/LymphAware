name: Mobile trial notice position

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-trial-position.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move trial notice below hero graphic on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/home-width-fix.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* MOBILE TRIAL NOTICE POSITION */'
          block = '''\n\n/* MOBILE TRIAL NOTICE POSITION */\n@media (max-width: 680px) {\n  /* Mobile hero sequence: heading, copy, product graphic, trial notice, actions. */\n  .home-page .home-trial-notice:not(.home-trial-notice-membership) {\n    order: 4;\n    width: 100%;\n    max-width: 100%;\n    margin: 0 0 24px;\n  }\n\n  .home-page .home-hero-product {\n    margin-bottom: 24px;\n  }\n\n  .home-page .home-hero-actions {\n    order: 5;\n    margin-top: 0;\n  }\n}\n'''
          if marker not in text:
              p.write_text(text.rstrip() + block, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q "MOBILE TRIAL NOTICE POSITION" css/home-width-fix.css
          node scripts/audit-repo.mjs

      - name: Commit
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/home-width-fix.css
          git diff --cached --quiet && exit 0
          git commit -m "Move trial notice below mobile hero graphic"
          git push
