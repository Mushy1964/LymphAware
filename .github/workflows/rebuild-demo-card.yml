name: Rebuild demo card with approved logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-demo-card.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow cairosvg

      - name: Rebuild demo card PNG
        shell: python
        run: |
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw
          import cairosvg

          card_path = Path("assets/demo/LymphAware_Alex_Morgan_Demo_Card.png")
          logo_path = Path("assets/brand/LymphAwareID_Logo_20260921.svg")

          card = Image.open(card_path).convert("RGBA")
          width, height = card.size

          # Clear the old logo/header only. All patient, QR and ID content stays untouched.
          draw = ImageDraw.Draw(card)
          draw.rectangle((0, 0, width, round(height * 0.305)), fill=(255, 255, 255, 255))

          logo_width = round(width * 0.91)
          logo_png = cairosvg.svg2png(url=str(logo_path), output_width=logo_width)
          logo = Image.open(BytesIO(logo_png)).convert("RGBA")

          x = round(width * 0.012)
          y = round(height * 0.015)
          card.alpha_composite(logo, (x, y))

          card.save(card_path, "PNG", optimize=True)

          index_path = Path("index.html")
          text = index_path.read_text(encoding="utf-8")
          text = text.replace(
              "LymphAware_Alex_Morgan_Demo_Card.png?v=20260922-flat",
              "LymphAware_Alex_Morgan_Demo_Card.png?v=20260922-bold"
          )
          index_path.write_text(text, encoding="utf-8")

      - name: Commit rebuilt demo card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/LymphAware_Alex_Morgan_Demo_Card.png index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update demo card with approved bold logo"
          git push origin main
