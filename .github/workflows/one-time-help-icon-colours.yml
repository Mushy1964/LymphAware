name: One-time homepage help icon colours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-help-icon-colours.yml'

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct help icon colour sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="help-scenario-icon help-icon-blue">\n              <img src="/assets/icons/Alarm_Blue.svg"', '<div class="help-scenario-icon help-icon-green">\n              <img src="/assets/icons/Alarm_Green.svg"', 1)
          s=s.replace('<div class="help-scenario-icon help-icon-green">\n              <img src="/assets/icons/Everyday_Life_Green.svg"', '<div class="help-scenario-icon help-icon-blue">\n              <img src="/assets/icons/Everyday_Life_Blue.svg"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct homepage help icon colour sequence"
          git push
