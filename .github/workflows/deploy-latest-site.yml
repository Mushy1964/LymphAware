name: Deploy latest site to Netlify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-latest-site.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy current main branch
        env:
          NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: a63e1e7e-ae6f-45fa-a78b-82b73be2b064
        run: |
          TOKEN="$NETLIFY_AUTH_TOKEN_PRIMARY"
          if [ -z "$TOKEN" ]; then TOKEN="$NETLIFY_AUTH_TOKEN_FALLBACK"; fi
          if [ -z "$TOKEN" ]; then
            echo "::notice::No Netlify deployment token is configured in GitHub Actions."
            exit 0
          fi
          npx -y netlify-cli@latest deploy --prod --dir=. --site "$NETLIFY_SITE_ID" --auth "$TOKEN"
