name: One-time member onboarding email improvements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-member-onboarding-email.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply onboarding email improvements
        run: python scripts/one_time_member_onboarding_email.py

      - name: Commit changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/stripe-webhook.mjs profile-v2/index.html
          git commit -m "Improve member onboarding and profile-ready notification"
          git push
