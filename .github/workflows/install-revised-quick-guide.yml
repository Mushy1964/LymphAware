name: Install revised Quick Guide

on:
  push:
    branches: [main]
    paths:
      - '.quickguide-assets/ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build revised Quick Guide image
        run: |
          mkdir -p assets/guides
          cat .quickguide-assets/qg-* | base64 --decode > assets/guides/LymphAwareID_Quick_Guide_20260925.webp
          python - <<'PY'
          from pathlib import Path

          old = '/assets/guides/LymphAwareID_Quick_Guide_20260924.jpg'
          new = '/assets/guides/LymphAwareID_Quick_Guide_20260925.webp'

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Homepage Quick Guide reference not found')
          text = text.replace(old, new)
          text = text.replace('width="1122" height="1402" loading="lazy"', 'width="800" height="1131" loading="lazy"')
          home.write_text(text, encoding='utf-8')

          guide = Path('quick-guide/index.html')
          text = guide.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Quick Guide page image reference not found')
          text = text.replace(old, new)
          text = text.replace('download="LymphAwareID_Quick_Guide.jpg">Download guide (JPG)</a>',
                              'download="LymphAwareID_Quick_Guide.webp">Download guide</a>')
          text = text.replace('width="1122" height="1402" alt="LymphAware ID Quick Guide showing five steps to set up, preview and use your QR-linked ID card and profile."',
                              'width="800" height="1131" alt="LymphAware ID Quick Guide: five steps to setting up and using your card. The full text follows below."')
          guide.write_text(text, encoding='utf-8')
          PY
      - name: Commit revised guide
        run: |
          rm -rf .quickguide-assets
          rm -f .github/workflows/install-revised-quick-guide.yml
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add -A
          git commit -m "Publish revised LymphAware ID Quick Guide"
          git push
