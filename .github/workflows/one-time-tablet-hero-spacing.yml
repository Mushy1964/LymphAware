name: One-time tablet hero spacing refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-tablet-hero-spacing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply tablet hero spacing refinement
        run: python scripts/one_time_tablet_hero_spacing.py

      - name: Commit changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add css/home.css
          git commit -m "Refine tablet hero spacing"
          git push
