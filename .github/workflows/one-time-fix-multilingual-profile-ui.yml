name: One-time multilingual profile UI fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-multilingual-profile-ui.yml'

permissions:
  contents: write

jobs:
  fix-profile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix multilingual public profile presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('p-v3/index.html')
          s = path.read_text(encoding='utf-8')

          s = s.replace(
            ".id{margin:0;color:#566575;font-weight:600}.id span{color:#172536;font-weight:800;margin-left:5px}",
            ".id{margin:0;color:#566575;font-weight:600;display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap;white-space:nowrap}.id span{color:#172536;font-weight:800;margin-left:0}.id #patient-id{white-space:nowrap}"
          )

          s = s.replace(
            ".label strong{display:block;font-size:1rem;margin-bottom:2px}",
            ".label strong{display:block;font-size:1rem;margin-bottom:2px;color:#172536}"
          )

          s = s.replace(
            ".footer{margin-top:8px;padding:12px 14px;border:1px solid #ebcaca;border-radius:14px;background:#fff2f2;color:#566575;font-size:.8rem;line-height:1.45}.footer h2{margin:0 0 8px;color:#172536;font-size:.95rem}",
            ".footer{margin-top:8px;padding:12px 14px;border:1px solid #ebcaca;border-radius:14px;background:#fff2f2;color:#566575;font-size:.8rem;line-height:1.45}.footer-heading{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:#172536;font-size:.95rem;font-weight:800}.footer-icon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px}.footer-icon img{display:block;width:26px;height:26px;object-fit:contain}"
          )

          s = s.replace(
            '<div class="footer"><h2 id="footer-title"></h2><p id="footer-1"></p><p id="footer-2"></p></div>',
            '<div class="footer"><div class="footer-heading"><span class="footer-icon" aria-hidden="true"><img src="/assets/icons/exclamation.svg" alt=""></span><span id="footer-title"></span></div><p id="footer-1"></p><p id="footer-2"></p></div>'
          )

          s = s.replace("id:'Identifiant LymphAware :'", "id:'ID LymphAware :'")

          path.write_text(s, encoding='utf-8')

          lang = Path('data/languages/fr.json')
          t = lang.read_text(encoding='utf-8')
          t = t.replace('"lymphaware_id_label": "Identifiant LymphAware :"', '"lymphaware_id_label": "ID LymphAware :"')
          lang.write_text(t, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p-v3/index.html data/languages/fr.json
          git commit -m "Fix multilingual public profile presentation"
          git push
