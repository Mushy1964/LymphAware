name: Rebuild Quick Guide image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-quick-guide.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebuild Quick Guide JPG
        shell: bash
        run: |
          cat .tmp/quickguide/part*.txt | base64 -d > assets/guides/LymphAware_Quick_Guide.jpg
          test -s assets/guides/LymphAware_Quick_Guide.jpg
      - name: Commit updated Quick Guide
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/guides/LymphAware_Quick_Guide.jpg
          git diff --cached --quiet || git commit -m "Update Quick Guide image"
          git push
