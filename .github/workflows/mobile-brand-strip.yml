name: Mobile brand strip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-brand-strip.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add homepage mobile brand strip
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('js/public-chrome.js')
          js = js_path.read_text(encoding='utf-8')
          old = '''        </div>\n        <nav class="public-nav-bar" aria-label="Main navigation">'''
          new = '''        </div>\n        <div class="public-mobile-brand-strip" aria-label="LymphAware values">\n          <span>Patient-led</span><span aria-hidden="true">•</span><span>Private by design</span><span aria-hidden="true">•</span><span>Easy to share</span>\n        </div>\n        <nav class="public-nav-bar" aria-label="Main navigation">'''
          if old not in js:
              raise SystemExit('Homepage header insertion point not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('css/public-chrome.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '.public-mobile-menu { display:none; position:relative; justify-self:end; }'
          if marker not in css:
              raise SystemExit('Mobile menu marker not found')
          css = css.replace(marker, '''.public-mobile-brand-strip { display:none; }\n\n.public-mobile-menu { display:none; position:relative; justify-self:end; }''', 1)

          mobile_marker = '''  .public-site-search,\n  .public-help-menu,\n  .public-account-link,\n  .public-nav-bar { display:none !important; }'''
          mobile_new = '''  .public-site-search,\n  .public-help-menu,\n  .public-account-link,\n  .public-nav-bar { display:none !important; }\n  .public-mobile-brand-strip {\n    display:flex;\n    width:100%;\n    min-height:48px;\n    padding:0 14px;\n    align-items:center;\n    justify-content:center;\n    gap:8px;\n    background:#0053b7;\n    color:#fff;\n    font-size:.82rem;\n    line-height:1;\n    font-weight:800;\n    letter-spacing:.01em;\n    text-align:center;\n    white-space:nowrap;\n    border-top:1px solid #00479d;\n  }\n  .public-mobile-brand-strip span[aria-hidden="true"] {\n    opacity:.7;\n    font-size:.72rem;\n  }'''
          if mobile_marker not in css:
              raise SystemExit('Mobile header marker not found')
          css = css.replace(mobile_marker, mobile_new, 1)
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add js/public-chrome.js css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Add branded mobile homepage strip"
          git push
