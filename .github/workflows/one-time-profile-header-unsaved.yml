name: One-time profile header and unsaved changes fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-profile-header-unsaved.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align profile header and restore unsaved change warning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profile-v2/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</style>\n</head>', '</style>\n<link rel="stylesheet" href="/css/secondary-header.css">\n</head>', 1)
          s=s.replace('<header class="site-header profile-site-header">', '<header class="site-header secondary-header profile-site-header">', 1)
          s=s.replace('class="button button-secondary">Back to Portal</a>', 'class="button button-secondary back-to-portal-button">Back to Portal</a>', 1)
          s=s.replace('.header-logo{display:block;width:340px;max-width:100%;height:auto}.profile-site-header .header-inner{width:min(1280px,calc(100% - 48px));max-width:1280px;margin:0 auto}', '.header-logo{display:block;width:390px;max-width:100%;height:auto}.profile-site-header .header-inner{width:min(1180px,calc(100% - 40px));max-width:1180px;min-height:92px;margin:0 auto}.profile-site-header .header-actions .button{min-width:150px;min-height:46px;padding:0 22px;border-radius:10px;font-size:1rem}', 1)
          s=s.replace('@media(max-width:680px){.profile-page{padding:36px 12px}.profile-site-header .header-inner{width:calc(100% - 24px);min-height:72px;gap:10px}.profile-site-header .header-logo{width:220px;max-width:calc(100vw - 118px)}.profile-site-header .header-actions .button{min-width:72px!important;min-height:44px;padding:0 10px!important;font-size:0!important}.profile-site-header .header-actions .button::after{content:"Portal";font-size:.92rem;font-weight:700;line-height:1.2}', '@media(max-width:680px){.profile-page{padding:36px 12px}.profile-site-header .header-inner{width:min(100% - 28px,1180px);min-height:74px;gap:12px}.profile-site-header .header-logo{width:300px;max-width:calc(100vw - 150px)}.profile-site-header .header-actions .button{min-width:82px!important;min-height:44px;padding:0 12px!important;font-size:0!important}.profile-site-header .header-actions .button::after{content:"Portal";font-size:1rem;font-weight:700;line-height:1.2}', 1)
          s=s.replace('@media(max-width:360px){.profile-site-header .header-logo{width:190px;max-width:calc(100vw - 150px)}', '@media(max-width:420px){.profile-site-header .header-logo{max-width:calc(100vw - 132px)}.profile-site-header .header-actions .button{min-width:76px!important;padding:0 9px!important}}\n@media(max-width:360px){.profile-site-header .header-logo{max-width:calc(100vw - 132px)}', 1)
          guard="let unsavedChanges=false;\nconst profileFormForChanges=$('profile-form');\nfunction markProfileDirty(event){if(event&&event.target&&event.target.id==='photo-input'&&!event.target.files?.length)return;unsavedChanges=true;}\nprofileFormForChanges.addEventListener('input',markProfileDirty);\nprofileFormForChanges.addEventListener('change',markProfileDirty);\nwindow.addEventListener('beforeunload',event=>{if(!unsavedChanges)return;event.preventDefault();event.returnValue='';});\ndocument.addEventListener('click',event=>{if(!unsavedChanges)return;const link=event.target.closest('a[href]');if(!link)return;const href=link.getAttribute('href')||'';if(!href||href.startsWith('#')||href.startsWith('javascript:'))return;if(window.confirm('You have unsaved changes to your LymphAware profile. Leave this page without saving them?')){unsavedChanges=false;return;}event.preventDefault();});\nconst saveStatusObserver=new MutationObserver(()=>{const status=$('status');if(status&&!status.hidden&&status.classList.contains('success'))unsavedChanges=false;});\nsaveStatusObserver.observe($('status'),{attributes:true,childList:true,subtree:true});\n"
          if '\nload();\n</script>' not in s: raise SystemExit('load marker not found')
          s=s.replace('\nload();\n</script>', '\n'+guard+'load();\n</script>', 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-v2/index.html
          git commit -m "Align profile header and warn about unsaved changes"
          git push
