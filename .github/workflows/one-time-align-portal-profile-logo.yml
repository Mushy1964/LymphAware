name: One-time Portal Profile logo alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-align-portal-profile-logo.yml'

permissions:
  contents: write

jobs:
  align-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Portal-only mobile logo sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('portal/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.secondary-header .header-logo{max-width:calc(100vw - 120px)!important}'
          if old not in s:
              raise SystemExit('Portal-only logo override not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/index.html
          git commit -m "Align Portal and My Profile logo sizing"
          git push
