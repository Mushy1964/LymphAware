name: One-time portal privacy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-portal-privacy-cleanup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply portal and profile fixes
        run: python scripts/one_time_portal_privacy_cleanup.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add portal/index.html profile-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify language status and fix emergency contact confirmation"
          git push
