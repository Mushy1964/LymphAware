name: Match homepage logo size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-homepage-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Match homepage logo sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/public-chrome.css')
          css = p.read_text(encoding='utf-8')
          css = css.replace(
              'grid-template-columns: minmax(275px, 330px) minmax(220px, 1fr) 132px 132px;',
              'grid-template-columns: minmax(320px, 390px) minmax(220px, 1fr) 132px 132px;',
              1,
          )
          css = css.replace('  width: 330px;\n  max-width: 100%;', '  width: 390px;\n  max-width: 100%;', 1)
          css = css.replace(
              'grid-template-columns: minmax(225px, 270px) minmax(160px,1fr) 112px 112px;',
              'grid-template-columns: minmax(250px, 300px) minmax(160px,1fr) 112px 112px;',
              1,
          )
          css = css.replace('  .public-site-logo { width:270px; }', '  .public-site-logo { width:300px; }', 1)
          css = css.replace(
              '  .public-site-logo { width:270px; max-width:calc(100vw - 132px); }',
              '  .public-site-logo { width:300px; max-width:calc(100vw - 132px); }',
              1,
          )
          p.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Match homepage logo size to other pages"
          git push
