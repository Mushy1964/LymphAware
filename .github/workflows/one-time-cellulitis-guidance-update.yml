name: One-time cellulitis guidance update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cellulitis-guidance-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update cellulitis guidance content
        run: python scripts/one_time_cellulitis_guidance_update.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add understanding-lymphoedema/index.html for-professionals/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add patient cellulitis awareness and professional guidance"
          git push
