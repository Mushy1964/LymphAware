name: One-time language dashboard draft status update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-language-dashboard-drafts.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update language dashboard statuses
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/languages/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fixedTextPacks={FR:'Approved'}", "fixedTextPacks={FR:'Approved',ES:'Draft — review required',DE:'Draft — review required',PT:'Draft — review required',IT:'Draft — review required'}")
          old="""if(record.language_code==='FR'){if(record.setup_status==='IN_REVIEW')action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/admin/languages/review/?id=${encodeURIComponent(record.id)}\">Review &amp; Approve French Profile</a><a class=\"button button-secondary\" href=\"/admin/languages/prepare/?id=${encodeURIComponent(record.id)}\">Edit French Draft</a></div>`;else if(record.setup_status==='APPROVED'&&record.qr_token)action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/p/${encodeURIComponent(record.qr_token)}\" target=\"_blank\" rel=\"noopener\">View French QR Profile</a></div>`;else if(record.setup_status==='APPROVED')action='<div class=\"language-actions\"><span class=\"fixed-approved\">French QR profile active</span></div>';else action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/admin/languages/prepare/?id=${encodeURIComponent(record.id)}\">Prepare French Profile</a></div>`}"""
          new="""if(fixedPack==='Approved'){const language=escapeHtml(record.language_name||'Language');if(record.setup_status==='IN_REVIEW')action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/admin/languages/review/?id=${encodeURIComponent(record.id)}\">Review &amp; Approve ${language} Profile</a><a class=\"button button-secondary\" href=\"/admin/languages/prepare/?id=${encodeURIComponent(record.id)}\">Edit ${language} Draft</a></div>`;else if(record.setup_status==='APPROVED'&&record.qr_token)action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/p/${encodeURIComponent(record.qr_token)}\" target=\"_blank\" rel=\"noopener\">View ${language} QR Profile</a></div>`;else if(record.setup_status==='APPROVED')action=`<div class=\"language-actions\"><span class=\"fixed-approved\">${language} QR profile active</span></div>`;else action=`<div class=\"language-actions\"><a class=\"button button-primary\" href=\"/admin/languages/prepare/?id=${encodeURIComponent(record.id)}\">Prepare ${language} Profile</a></div>`}else action=`<div class=\"language-actions\"><span class=\"language-meta\">Fixed ${escapeHtml(record.language_name||'language')} wording awaiting review before patient setup can begin.</span></div>`"""
          if old not in s:
              raise SystemExit('Expected French action block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/languages/index.html
          git commit -m "Show draft language pack statuses"
          git push
