name: Logo blue mobile navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/logo-blue-mobile-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match mobile navigation blue to approved logo
        run: |
          python - <<'PY'
          from pathlib import Path

          # Approved LymphAware logo blue: #0053b7
          p = Path('css/public-chrome.css')
          css = p.read_text(encoding='utf-8')
          old = 'background: linear-gradient(180deg, #263d77 0%, #203568 100%);'
          if old not in css:
              raise SystemExit('Could not find mobile menu background')
          css = css.replace(old, 'background: #0053b7;', 1)
          css = css.replace('background: rgba(20, 120, 200, .32);', 'background: #00479d;', 1)
          p.write_text(css, encoding='utf-8')

          p = Path('css/secondary-header.css')
          css = p.read_text(encoding='utf-8')
          old = 'background: linear-gradient(180deg, #263d77 0%, #203568 100%);'
          if old not in css:
              raise SystemExit('Could not find Return to website blue background')
          css = css.replace(old, 'background: #0053b7;', 1)
          css = css.replace('border-top: 1px solid #203568;', 'border-top: 1px solid #00479d;', 1)
          p.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css css/secondary-header.css
          git diff --cached --quiet && exit 0
          git commit -m "Match mobile navigation to LymphAware logo blue"
          git push
