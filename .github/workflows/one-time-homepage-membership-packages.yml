name: One-time homepage membership packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homepage-membership-packages.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Plus package price
        env:
          SCRIPT_B64: ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnA9UGF0aCgiaW5kZXguaHRtbCIpCnM9cC5yZWFkX3RleHQoZW5jb2Rpbmc9InV0Zi04IikKcz1zLnJlcGxhY2UoIsKjIzM5Ljk5IiwiwqMzOS45OSIpCnAud3JpdGVfdGV4dChzLGVuY29kaW5nPSJ1dGYtOCIpCg==
        run: echo "$SCRIPT_B64" | base64 -d | python
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Plus package price"
          git push
