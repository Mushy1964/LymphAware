name: One-time homepage membership packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homepage-membership-packages.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage membership section
        env:
          SCRIPT_B64: 
        run: echo "$SCRIPT_B64" | base64 -d | python
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all three membership packages on homepage"
          git push
