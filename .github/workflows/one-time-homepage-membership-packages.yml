name: One-time homepage membership packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-homepage-membership-packages.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage membership section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css="""    .home-membership-grid,
    .home-language-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
      gap: 54px;
      align-items: center;
    }
"""
          new_css="""    .home-membership-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    .home-language-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
      gap: 54px;
      align-items: center;
    }

    .home-membership-packages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .home-membership-packages .home-membership-price-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .home-membership-package-featured {
      border: 2px solid #7ab58a;
      box-shadow: 0 16px 36px rgba(31, 47, 66, 0.11);
    }

    .home-membership-package-badge {
      align-self: flex-start;
      margin: 0 0 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef7f0;
      color: #16853f;
      font-size: .82rem;
      font-weight: 800;
    }

    .home-membership-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .home-membership-actions .button {
      min-width: 230px;
      justify-content: center;
    }
"""
          if old_css not in s:
              raise SystemExit('Membership grid CSS block not found')
          s=s.replace(old_css,new_css,1)

          old_media="""    @media (max-width: 900px) {
      .home-membership-grid,
      .home-language-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }
"""
          new_media="""    @media (max-width: 900px) {
      .home-membership-packages {
        grid-template-columns: 1fr;
      }

      .home-language-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }
"""
          if old_media not in s:
              raise SystemExit('Membership media block not found')
          s=s.replace(old_media,new_media,1)

          start=s.index('  <!-- I WANT ONE — WHAT DOES IT COST? -->')
          end=s.index('  <!-- CAN I USE IT IN ANOTHER LANGUAGE? -->')
          new_section='''  <!-- I WANT ONE — WHAT DOES IT COST? -->
  <section class="home-membership-section" aria-labelledby="membership-title">
    <div class="container home-membership-grid">

      <div class="home-membership-copy">
        <p class="home-membership-eyebrow">LymphAware membership</p>
        <h2 id="membership-title">Choose the LymphAware package that suits you.</h2>
        <p class="home-membership-lead">
          Each option gives you five years of LymphAware membership, access to your secure Patient Portal
          and a patient-controlled QR profile. Choose the package that best matches how you expect to use LymphAware.
        </p>
      </div>

      <div class="home-membership-packages">
        <article class="home-membership-price-card">
          <p class="home-membership-price-label">5-Year Membership</p>
          <p class="home-membership-price">£29.99</p>
          <p class="home-membership-term">One payment for five years</p>
          <ul class="home-membership-benefits">
            <li>1 English QR profile</li>
            <li>1 English LymphAware ID card</li>
            <li>1 lanyard &amp; holder</li>
            <li>Secure Patient Portal access</li>
            <li>Update your information during membership</li>
          </ul>
        </article>

        <article class="home-membership-price-card home-membership-package-featured">
          <p class="home-membership-package-badge">Extra card &amp; holder</p>
          <p class="home-membership-price-label">5-Year Plus</p>
          <p class="home-membership-price">£39.99</p>
          <p class="home-membership-term">One payment for five years</p>
          <ul class="home-membership-benefits">
            <li>1 English QR profile</li>
            <li>2 English LymphAware ID cards</li>
            <li>2 lanyards &amp; holders</li>
            <li>Secure Patient Portal access</li>
            <li>Update your information during membership</li>
          </ul>
        </article>

        <article class="home-membership-price-card">
          <p class="home-membership-package-badge">For use in two languages</p>
          <p class="home-membership-price-label">5-Year Multilingual</p>
          <p class="home-membership-price">£49.99</p>
          <p class="home-membership-term">One payment for five years</p>
          <ul class="home-membership-benefits">
            <li>1 English QR profile</li>
            <li>1 additional-language QR profile</li>
            <li>2 English ID cards</li>
            <li>2 translated-language ID cards</li>
            <li>2 lanyards &amp; holders in total</li>
          </ul>
        </article>
      </div>

      <div class="home-membership-actions">
        <p class="home-membership-renewal">
          Postage &amp; packing is added according to delivery destination: United Kingdom, Europe or Rest of World.
          You will be reminded before your five-year membership is due to expire, so you can choose whether to renew.
        </p>
        <a href="/register/" class="button button-primary">Create your account</a>
      </div>

    </div>
  </section>

'''
          s=s[:start]+new_section+s[end:]

          old_lang='''        <p class="home-language-note">
          Additional language packages will be purchased separately from the main membership.
        </p>'''
          new_lang='''        <p class="home-language-note">
          Choose the 5-Year Multilingual package when joining, or add another language later from your Patient Portal.
          Only languages currently available from LymphAware can be selected.
        </p>'''
          if old_lang not in s:
              raise SystemExit('Language note not found')
          s=s.replace(old_lang,new_lang,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all three membership packages on homepage"
          git push
