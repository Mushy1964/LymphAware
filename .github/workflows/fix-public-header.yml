name: Fix public header and secondary page buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply header fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('js/public-chrome.js')
          js = js_path.read_text(encoding='utf-8')

          js = js.replace(
              "  if (!publicPaths.has(path) && path !== '/404.html') return;\n",
              "  if (!publicPaths.has(path) && path !== '/404.html') return;\n\n  const isHomepage = path === '/';\n",
              1,
          )

          js = js.replace(
              "  const header = document.querySelector('header.site-header');\n  if (header) {\n",
              "  const header = document.querySelector('header.site-header');\n  if (header && isHomepage) {\n",
              1,
          )

          js = js.replace(
              '                <a href="/accessibility/">Accessibility</a>\n              </nav>',
              '                <a href="/accessibility/">Accessibility</a>\n                <a href="/cookies/">Cookies</a>\n                <a href="/terms/">Terms &amp; Conditions</a>\n              </nav>',
              1,
          )

          js = js.replace(
              '                <a href="/contact/">Contact</a>\n                <a href="/sign-in/" id="mobile-account-link" class="public-mobile-account">Sign In</a>',
              '                <a href="/contact/">Contact</a>\n                <a href="/accessibility/">Accessibility</a>\n                <a href="/cookies/">Cookies</a>\n                <a href="/terms/">Terms &amp; Conditions</a>\n                <a href="/sign-in/" id="mobile-account-link" class="public-mobile-account">Sign In</a>',
              1,
          )

          needle = '''        </nav>\n      </header>`;\n  }\n\n  const footer = document.querySelector('footer');'''
          replacement = '''        </nav>\n      </header>`;\n  } else if (header && header.classList.contains('secondary-header') && path !== '/404.html') {\n    // Keep the original secondary-page header and its page-specific Return to website/portal controls.\n    // Add only the shared blue navigation strip underneath it.\n    header.insertAdjacentHTML('afterend', `\n      <nav class="public-nav-bar public-nav-bar-secondary" aria-label="Main navigation">\n        <div class="container public-nav-inner">${desktopNav}</div>\n      </nav>`);\n  }\n\n  const footer = document.querySelector('footer');'''
          if needle not in js:
              raise SystemExit('Could not locate public header closing block')
          js = js.replace(needle, replacement, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('css/public-chrome.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.public-nav-bar {\n  background: linear-gradient(90deg, #0d62b4 0%, #0f78c9 100%);\n  color: #fff;\n}'''
          new = '''.public-nav-bar {\n  width: min(1180px, calc(100% - 40px));\n  margin-left: auto;\n  margin-right: auto;\n  background: linear-gradient(90deg, #0d62b4 0%, #0f78c9 100%);\n  color: #fff;\n}'''
          if old not in css:
              raise SystemExit('Could not locate public nav bar CSS')
          css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit fixes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add js/public-chrome.js css/public-chrome.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine public header and restore secondary page controls"
          git push
