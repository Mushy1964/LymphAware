name: One-time capitalise order lanyard labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-capitalise-order-lanyards.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capitalise customer-facing order labels
        run: python scripts/one_time_capitalise_order_lanyards.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add netlify/functions/member-package-summary.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Capitalise Lanyard labels in member orders"
          git push
