name: One-time align homepage account CTA

on:
  push:
    paths:
      - '.github/workflows/one-time-align-home-cta.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Align homepage CTA wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="/register/" class="button button-primary">Register</a>'
          new = '<a href="/register/" class="button button-primary">Create your account</a>'
          if old not in text:
              raise SystemExit('Expected homepage Register CTA not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "LymphAware automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Align homepage registration CTA wording"
          git push
