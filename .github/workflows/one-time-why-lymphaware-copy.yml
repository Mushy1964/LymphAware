name: One-time Why LymphAware copy update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-why-lymphaware-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Why LymphAware copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''        <p class="home-understanding-lead">\n          Living with lymphoedema can mean repeatedly having to explain\n          your condition, your needs and the support that may help you.\n        </p>\n\n        <p>\n          LymphAware provides a simple way to share information you have\n          chosen to make available, using a physical ID card and your\n          QR-linked profile.\n        </p>'''
          new = '''        <p class="home-understanding-lead">\n          Living with lymphoedema can mean repeatedly having to explain\n          not only your condition, but how it affects you, your needs and\n          the support that may help you.\n        </p>\n\n        <p>\n          Many medical identification systems are designed primarily to\n          communicate critical medical information. LymphAware has a\n          different focus: helping you communicate how lymphoedema affects\n          you in everyday, healthcare and unexpected situations.\n        </p>\n\n        <p>\n          Using a physical ID card and patient-controlled QR-linked profile,\n          you choose the information you want to make available — so others\n          can understand not just what condition you have, but what may help\n          you in that moment.\n        </p>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Why LymphAware copy block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify what makes LymphAware different"
          git push
