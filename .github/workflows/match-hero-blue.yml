name: Match hero blue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-hero-blue.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Your information to approved logo blue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/home.css')
          css = p.read_text(encoding='utf-8')
          old = '.home-page .hero-line-blue {\n  color: #1768b0;\n}'
          new = '.home-page .hero-line-blue {\n  color: #0053b7;\n}'
          if old not in css:
              raise SystemExit('Hero blue rule not found')
          p.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/home.css
          git diff --cached --quiet && exit 0
          git commit -m "Match homepage hero blue to LymphAware logo"
          git push
