name: Generate email logo PNG

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-email-logo.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate email-safe PNG
        run: |
          rsvg-convert -w 1200 assets/brand/LymphAwareID_Logo_20260921.svg -o assets/brand/LymphAwareID_Email_Logo.png
          test -s assets/brand/LymphAwareID_Email_Logo.png
      - name: Commit generated logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/LymphAwareID_Email_Logo.png
          git diff --cached --quiet || git commit -m "Add email-safe LymphAware ID logo"
          git push
