name: One-time profile identity rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-profile-identity-rules.yml'

permissions:
  contents: write

jobs:
  update-profile-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce one switch and required identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('profile-v2/index.html')
          s = path.read_text(encoding='utf-8')

          old = '<label for="display-name">Display name</label><input id="display-name" type="text" autocomplete="name">'
          new = '<label for="display-name">Display name <span aria-hidden="true">*</span></label><input id="display-name" type="text" autocomplete="name" required aria-required="true">'
          if old not in s:
              raise SystemExit('Display name field pattern not found')
          s = s.replace(old, new, 1)

          old = 'A clear, recent photograph can help someone identify you. If you add one, it will appear at the top of your QR profile.'
          new = 'A clear, recent photograph is required before your profile can be saved. It will appear at the top of your QR profile and on your LymphAware ID card.'
          if old not in s:
              raise SystemExit('Photo help pattern not found')
          s = s.replace(old, new, 1)

          start_pattern = re.compile(
              r"\$\('profile-form'\)\.addEventListener\('submit',async e=>\{e\.preventDefault\(\);\$\('save-button'\)\.disabled=true;\$\('status'\)\.hidden=true;try\{let photoPath=profile\.photo_path\|\|null;const file=\$\('photo-input'\)\.files\?\.\[0\];"
          )
          replacement = "$('profile-form').addEventListener('submit',async e=>{e.preventDefault();$('status').hidden=true;const displayName=$('display-name').value.trim();if(!displayName){setStatus('Please enter your display name before saving your profile.','error');$('display-name').focus();return}let photoPath=profile.photo_path||null;const file=$('photo-input').files?.[0];if(!photoPath&&!file){setStatus('Please choose a photograph before saving your profile.','error');$('photo-input').focus();return}$('save-button').disabled=true;try{"
          s, count = start_pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Submit handler start pattern matched {count} times')

          s = s.replace("display_name:text('display-name')", 'display_name:displayName', 1)

          legacy_fields = [
              'show_photo_on_qr',
              'show_lymphoedema_on_qr',
              'show_compression_on_qr',
              'show_treatment_on_qr',
              'show_assistance_notes_on_qr',
              'show_emergency_contact_on_qr',
              'show_additional_on_qr',
          ]
          for field in legacy_fields:
              s = re.sub(rf"\s*{field}\s*:\s*true\s*,", '', s)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-v2/index.html
          git commit -m "Enforce required profile name and photo"
          git push
