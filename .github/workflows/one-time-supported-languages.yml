name: One-time supported language options

on:
  push:
    paths:
      - '.github/workflows/one-time-supported-languages.yml'

permissions:
  contents: write

jobs:
  update-language-options:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lock supported language options
        run: |
          python - <<'PY'
          from pathlib import Path

          portal = Path('portal/index.html')
          text = portal.read_text(encoding='utf-8')

          text = text.replace(
            ".language-choice input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #bfcbd2; border-radius: 9px; font: inherit; }",
            ".language-choice select { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #bfcbd2; border-radius: 9px; background: #fff; font: inherit; }\n    .language-choice-note { margin: 9px 0 0 !important; color: var(--muted); font-size: .92rem; }"
          )

          old = '''              <div id="language-choice" class="language-choice" hidden>\n                <label for="membership-language-name">Which language would you like?</label>\n                <input type="text" id="membership-language-name" maxlength="80" placeholder="For example, French or Spanish">\n              </div>'''
          new = '''              <div id="language-choice" class="language-choice" hidden>\n                <label for="membership-language-name">Which language would you like?</label>\n                <select id="membership-language-name">\n                  <option value="">Select a language</option>\n                  <option value="French">French</option>\n                  <option value="Spanish">Spanish</option>\n                  <option value="German">German</option>\n                  <option value="Portuguese">Portuguese</option>\n                  <option value="Italian">Italian</option>\n                </select>\n                <p class="language-choice-note">Need another language? Contact LymphAware and we can record your interest for future support.</p>\n              </div>'''
          if old not in text:
              raise SystemExit('Portal language input block not found')
          text = text.replace(old, new, 1)

          old_validation = """      if (languagePackage.checked && !languageName.value.trim()) {\n        portalMessage.textContent = 'Please enter the language required for your additional language package.';\n        languageName.focus();\n        return;\n      }"""
          new_validation = """      if (languagePackage.checked && !languageName.value) {\n        portalMessage.textContent = 'Please select a supported language for your additional language package.';\n        languageName.focus();\n        return;\n      }"""
          if old_validation not in text:
              raise SystemExit('Portal validation block not found')
          text = text.replace(old_validation, new_validation, 1)

          old_payload = "languageName: languageName.value.trim()"
          if old_payload not in text:
              raise SystemExit('Portal language payload not found')
          text = text.replace(old_payload, "languageName: languageName.value", 1)

          portal.write_text(text, encoding='utf-8')

          checkout = Path('netlify/functions/create-checkout-session.mjs')
          ctext = checkout.read_text(encoding='utf-8')

          old_parse = '''    const languagePackage = Boolean(body?.languagePackage);\n    const languageName = languagePackage\n      ? String(body?.languageName || '').trim().slice(0, 80)\n      : '';\n\n    if (languagePackage && !languageName) {\n      return new Response(JSON.stringify({ error: 'Please choose the language required for your additional language package.' }), {\n        status: 400,\n        headers: { 'Content-Type': 'application/json' }\n      });\n    }'''

          new_parse = '''    const languagePackage = Boolean(body?.languagePackage);\n\n    const supportedLanguages = {\n      French: 'FR',\n      Spanish: 'ES',\n      German: 'DE',\n      Portuguese: 'PT',\n      Italian: 'IT'\n    };\n\n    const requestedLanguage = languagePackage\n      ? String(body?.languageName || '').trim()\n      : '';\n\n    const languageName = Object.prototype.hasOwnProperty.call(supportedLanguages, requestedLanguage)\n      ? requestedLanguage\n      : '';\n\n    const languageCode = languageName\n      ? supportedLanguages[languageName]\n      : '';\n\n    if (languagePackage && !languageName) {\n      return new Response(JSON.stringify({\n        error: 'Please select one of the currently supported languages: French, Spanish, German, Portuguese or Italian.'\n      }), {\n        status: 400,\n        headers: { 'Content-Type': 'application/json' }\n      });\n    }'''

          if old_parse not in ctext:
              raise SystemExit('Checkout language parsing block not found')
          ctext = ctext.replace(old_parse, new_parse, 1)

          metadata_anchor = "    stripeForm.append('metadata[language_name]', languageName);"
          if metadata_anchor not in ctext:
              raise SystemExit('Checkout language metadata anchor not found')
          ctext = ctext.replace(
            metadata_anchor,
            metadata_anchor + "\n    stripeForm.append('metadata[language_code]', languageCode);",
            1
          )

          checkout.write_text(ctext, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "LymphAware automation"
          git config user.email "actions@users.noreply.github.com"
          git add portal/index.html netlify/functions/create-checkout-session.mjs
          git commit -m "Limit additional language packages to supported options"
          git push
