name: Refine homepage header actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-header-actions.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refine Help and Sign In controls
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('css/public-chrome.css')
          css = css_path.read_text(encoding='utf-8')

          css = css.replace(
              '  grid-template-columns: minmax(275px, 330px) minmax(220px, 1fr) auto auto;',
              '  grid-template-columns: minmax(275px, 330px) minmax(220px, 1fr) 132px 132px;',
              1,
          )

          css = css.replace(
              '.public-help-menu { position: relative; }',
              '.public-help-menu { position: relative; width: 132px; }',
              1,
          )

          css = css.replace(
              '''  min-width: 104px;\n  min-height: 50px;\n  padding: 0 14px;''',
              '''  width: 100%;\n  min-width: 132px;\n  min-height: 52px;\n  padding: 0 16px;''',
              1,
          )

          old_account = '''.public-account-link {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  min-width: 112px;\n  min-height: 50px;\n  padding: 0 12px;\n  color: #10294b;\n  font-weight: 800;\n  white-space: nowrap;\n}\n.public-account-link:hover,\n.public-account-link:focus { color:#1768b0; }\n.public-account-icon {\n  width: 22px;\n  height: 22px;\n  flex: 0 0 22px;\n}'''
          new_account = '''.public-account-link {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 9px;\n  width: 132px;\n  min-width: 132px;\n  min-height: 52px;\n  padding: 0 16px;\n  border-radius: 12px;\n  background: #eef6fb;\n  color: #10294b;\n  font-weight: 800;\n  white-space: nowrap;\n  transition: background .18s ease, color .18s ease, box-shadow .18s ease;\n}\n.public-account-link:hover,\n.public-account-link:focus {\n  background: #e2f0f8;\n  color: #1768b0;\n  box-shadow: 0 0 0 3px rgba(40,120,184,.08);\n}\n.public-account-icon {\n  width: 24px;\n  height: 24px;\n  flex: 0 0 24px;\n  box-sizing: border-box;\n  padding: 4px;\n  border-radius: 50%;\n  background: #1768b0;\n  color: #fff;\n}'''
          if old_account not in css:
              raise SystemExit('Could not locate account-link CSS')
          css = css.replace(old_account, new_account, 1)

          css = css.replace(
              '    grid-template-columns: minmax(225px, 270px) minmax(160px,1fr) auto auto;',
              '    grid-template-columns: minmax(225px, 270px) minmax(160px,1fr) 112px 112px;',
              1,
          )
          css = css.replace(
              '  .public-help-menu summary { min-width:88px; min-height:46px; padding:0 10px; }\n  .public-account-link { min-width:88px; min-height:46px; padding:0 8px; font-size:.9rem; }',
              '  .public-help-menu { width:112px; }\n  .public-help-menu summary { width:112px; min-width:112px; min-height:46px; padding:0 10px; }\n  .public-account-link { width:112px; min-width:112px; min-height:46px; padding:0 10px; font-size:.9rem; }',
              1,
          )

          css_path.write_text(css, encoding='utf-8')

          js_path = Path('js/public-chrome.js')
          js = js_path.read_text(encoding='utf-8')
          old_icon = '<svg class="public-account-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>'
          new_icon = '<svg class="public-account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.1" fill="currentColor"/><path d="M5.8 19.2c.8-3.5 3-5.3 6.2-5.3s5.4 1.8 6.2 5.3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>'
          if old_icon not in js:
              raise SystemExit('Could not locate Sign In icon')
          js = js.replace(old_icon, new_icon, 1)
          js_path.write_text(js, encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit refinements
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/public-chrome.css js/public-chrome.js
          git diff --cached --quiet && exit 0
          git commit -m "Refine Help and Sign In header controls"
          git push
