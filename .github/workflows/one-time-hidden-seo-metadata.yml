name: One-time hidden SEO metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hidden-seo-metadata.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add hidden SEO metadata
        run: python scripts/one_time_hidden_seo_metadata.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add index.html robots.txt sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Add hidden homepage SEO metadata and sitemap"
          git push
