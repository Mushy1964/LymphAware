name: One-time multilingual portal preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-multilingual-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add multilingual preview selector
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          portal_path = Path('portal/index.html')
          portal = portal_path.read_text(encoding='utf-8')

          old_css = '.profile-management-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.profile-management-actions .button{text-align:center}'
          new_css = old_css + '.preview-language-control{margin-top:18px;padding:15px 16px;border:1px solid #cbd8df;border-radius:12px;background:#fff}.preview-language-control[hidden]{display:none!important}.preview-language-control label{display:block;margin-bottom:7px;font-weight:800}.preview-language-control select{width:100%;min-height:46px;padding:10px 12px;border:1px solid #bfcbd2;border-radius:9px;background:#fff;font:inherit}.preview-language-control p{margin:8px 0 0!important;color:var(--muted)!important;font-size:.91rem!important}'
          portal = replace_once(portal, old_css, new_css, 'portal preview CSS')

          old_html = '''          <div class="profile-management-actions">
            <a id="profile-link" href="/profile/" class="button button-primary">Edit my profile</a>
            <a id="preview-link" href="/preview/" class="button button-secondary">Preview English profile</a>
            <a id="card-preview-link" href="/card-preview/" class="button button-secondary">Preview English ID card</a>
            <button type="button" id="orders-open" class="button button-secondary">View my orders</button>
            <button type="button" id="accessories-toggle" class="button button-secondary" aria-controls="accessories-panel" aria-expanded="false" hidden>Buy additional items</button>
          </div>'''
          new_html = '''          <div id="preview-language-control" class="preview-language-control" hidden>
            <label for="preview-language-select">Preview language</label>
            <select id="preview-language-select"><option value="EN">English</option></select>
            <p>Choose one of your purchased languages, then preview the matching ID card or QR profile.</p>
          </div>
          <div class="profile-management-actions">
            <a id="profile-link" href="/profile/" class="button button-primary">Edit my profile</a>
            <a id="preview-link" href="/preview/" class="button button-secondary">Preview English profile</a>
            <a id="card-preview-link" href="/card-preview/" class="button button-secondary">Preview English ID card</a>
            <button type="button" id="orders-open" class="button button-secondary">View my orders</button>
            <button type="button" id="accessories-toggle" class="button button-secondary" aria-controls="accessories-panel" aria-expanded="false" hidden>Buy additional items</button>
          </div>'''
          portal = replace_once(portal, old_html, new_html, 'portal preview controls')

          old_state = 'let accessoriesAvailable=false;'
          new_state = "let accessoriesAvailable=false;\nconst previewLanguageControl=document.getElementById('preview-language-control'),previewLanguageSelect=document.getElementById('preview-language-select'),previewLink=document.getElementById('preview-link'),cardPreviewLink=document.getElementById('card-preview-link');\nlet previewLanguageProfiles=[];"
          portal = replace_once(portal, old_state, new_state, 'portal preview state')

          old_funcs = "function languageStatusMessage(p){if(p.translation_error)return`The latest automatic update could not be completed. Your previous ${p.language_name} profile remains available while LymphAware resolves this.`;if(p.setup_status==='APPROVED')return`Your ${p.language_name} profile is automatically kept in step with your main English profile.`;if(p.setup_status==='IN_REVIEW')return`Your ${p.language_name} profile is being updated automatically.`;return`Your ${p.language_name} card and QR profile have been purchased. LymphAware will automatically prepare it from your main English profile.`}\n"
          new_funcs = old_funcs + "function configurePreviewLanguages(profiles){previewLanguageProfiles=(profiles||[]).map(p=>({...p,language_code:String(p.language_code||'').toUpperCase()}));if(!previewLanguageProfiles.length){previewLanguageControl.hidden=true;previewLanguageSelect.innerHTML='<option value=\"EN\">English</option>';previewLanguageSelect.value='EN';updatePreviewLinks();return}const previous=previewLanguageSelect.value||'EN';previewLanguageControl.hidden=false;previewLanguageSelect.innerHTML='<option value=\"EN\">English</option>'+previewLanguageProfiles.map(p=>{const ready=p.setup_status==='APPROVED'&&p.qr_token;const suffix=ready?'':' — preparing';return `<option value=\"${escapeHtml(p.language_code)}\"${ready?'':' disabled'}>${escapeHtml(p.language_name)}${suffix}</option>`}).join('');const selectable=[...previewLanguageSelect.options].some(o=>o.value===previous&&!o.disabled);previewLanguageSelect.value=selectable?previous:'EN';updatePreviewLinks()}\nfunction updatePreviewLinks(){const code=String(previewLanguageSelect?.value||'EN').toUpperCase();if(code==='EN'){previewLink.href='/preview/';previewLink.textContent='Preview English profile';cardPreviewLink.href='/card-preview/';cardPreviewLink.textContent='Preview English ID card';return}const selected=previewLanguageProfiles.find(p=>p.language_code===code);if(!selected)return;previewLink.href=selected.qr_token?`/p/${encodeURIComponent(selected.qr_token)}`:'/preview/';previewLink.textContent=`Preview ${selected.language_name} profile`;cardPreviewLink.href=`/card-preview/?language=${encodeURIComponent(code)}`;cardPreviewLink.textContent=`Preview ${selected.language_name} ID card`}\npreviewLanguageSelect.addEventListener('change',updatePreviewLinks);\n"
          portal = replace_once(portal, old_funcs, new_funcs, 'portal preview functions')

          old_load = "  renderAdditionalCardOptions(data||[]);\n  if(!data?.length){languageProfilesPanel.hidden=true;languageProfileList.innerHTML='';return []}"
          new_load = "  renderAdditionalCardOptions(data||[]);\n  configurePreviewLanguages(data||[]);\n  if(!data?.length){languageProfilesPanel.hidden=true;languageProfileList.innerHTML='';return []}"
          portal = replace_once(portal, old_load, new_load, 'portal preview load')

          portal_path.write_text(portal, encoding='utf-8')

          card_path = Path('card-preview/index.html')
          card = card_path.read_text(encoding='utf-8')

          old_client = "    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);\n"
          new_client = old_client + "    const CARD_COPY={EN:{name:'English',patient:'LYMPHOEDEMA PATIENT',qr:'SCAN QR CODE<br>to view my profile'},FR:{name:'French',patient:'PATIENT ATTEINT DE LYMPHŒDÈME',qr:'SCANNEZ LE CODE QR<br>pour consulter mon profil'},ES:{name:'Spanish',patient:'PACIENTE CON LINFEDEMA',qr:'ESCANEE EL CÓDIGO QR<br>para ver mi perfil'},DE:{name:'German',patient:'PATIENT MIT LYMPHÖDEM',qr:'QR-CODE SCANNEN<br>um mein Profil anzusehen'}};\n    const requestedLanguage=String(new URLSearchParams(location.search).get('language')||'EN').toUpperCase();\n"
          card = replace_once(card, old_client, new_client, 'card language constants')

          card = replace_once(card, '<p class="member-card-condition">Lymphoedema<br>Patient</p>', '<p id="card-condition" class="member-card-condition">Lymphoedema<br>Patient</p>', 'card condition id')
          card = replace_once(card, '<p class="member-card-qr-copy">SCAN QR CODE<br>to view my profile</p>', '<p id="card-qr-copy" class="member-card-qr-copy">SCAN QR CODE<br>to view my profile</p>', 'card QR copy id')
          card = replace_once(card, '<a href="/preview/" class="button button-secondary">Preview English profile</a>', '<a id="matching-profile-link" href="/preview/" class="button button-secondary">Preview English profile</a>', 'matching profile link')

          start = card.index('    async function loadCardPreview(){')
          end = card.index('\n\n    loadCardPreview();', start)
          old_function = card[start:end]
          new_function = '''    async function loadCardPreview(){
      const {data:{user},error:userError}=await supabaseClient.auth.getUser();
      if(userError||!user){location.href='/sign-in/';return}

      const language=CARD_COPY[requestedLanguage]?requestedLanguage:'EN';
      const copy=CARD_COPY[language];
      const {data:profile,error:profileError}=await supabaseClient
        .from('profiles')
        .select('display_name,lymphaware_id,photo_path,qr_token,qr_profile_active')
        .eq('user_id',user.id)
        .maybeSingle();

      if(profileError||!profile){showError('Your ID card details could not be loaded. Please return to the portal and try again.');return}

      let cardToken=profile.qr_token;
      let cardVisible=profile.qr_profile_active===true;
      let matchingProfileHref='/preview/';

      if(language!=='EN'){
        const {data:languageProfile,error:languageError}=await supabaseClient
          .from('language_profiles')
          .select('language_name,language_code,qr_token,setup_status,qr_profile_active')
          .eq('user_id',user.id)
          .eq('language_code',language)
          .maybeSingle();
        if(languageError||!languageProfile){showError(`Your ${copy.name} language package could not be found.`);return}
        if(languageProfile.setup_status!=='APPROVED'||!languageProfile.qr_token){showError(`Your ${copy.name} card preview will be available when the automatic translation has finished.`);return}
        cardToken=languageProfile.qr_token;
        cardVisible=languageProfile.qr_profile_active===true;
        matchingProfileHref=`/p/${encodeURIComponent(languageProfile.qr_token)}`;
      }

      const missing=[];
      if(!String(profile.display_name||'').trim())missing.push('display name');
      if(!String(profile.photo_path||'').trim())missing.push('photograph');
      if(!String(profile.lymphaware_id||'').trim())missing.push('LymphAware ID');
      if(!String(cardToken||'').trim())missing.push('QR profile link');
      if(missing.length){showError(`Your card preview will be available after you add or receive the following: ${missing.join(', ')}.`);return}

      const profileUrl=`https://lymphaware.com/p/${encodeURIComponent(cardToken)}`;
      document.title=`Preview My ${copy.name} ID Card | LymphAware`;
      document.querySelector('.member-card').setAttribute('aria-label',`Preview of my ${copy.name} LymphAware ID card`);
      document.getElementById('card-name').textContent=profile.display_name;
      document.getElementById('card-id').textContent=profile.lymphaware_id;
      document.getElementById('card-photo').src=`/ebp/${encodeURIComponent(cardToken)}`;
      document.getElementById('card-condition').textContent=copy.patient;
      document.getElementById('card-qr-copy').innerHTML=copy.qr;
      const matchingProfileLink=document.getElementById('matching-profile-link');
      matchingProfileLink.href=matchingProfileHref;
      matchingProfileLink.textContent=`Preview ${copy.name} profile`;

      const toolbar=document.getElementById('card-preview-toolbar');
      toolbar.innerHTML=`<strong>Your ${copy.name} ID card preview.</strong> This shows how the front of your ${copy.name} LymphAware card will look. The QR code can be scanned from this screen using another phone or tablet.`;
      if(!cardVisible){
        toolbar.innerHTML=`<strong>Your ${copy.name} ID card preview.</strong> Your QR profile is currently switched off. The QR code is valid, but a scanner will see the unavailable-profile screen until you reactivate it.`;
      }

      try{
        if(typeof QRCode!=='function')throw new Error('QR code library unavailable');
        new QRCode(document.getElementById('card-qr'),{
          text:profileUrl,
          width:320,
          height:320,
          colorDark:'#000000',
          colorLight:'#ffffff',
          correctLevel:QRCode.CorrectLevel.M
        });
      }catch(error){console.error(error);showError('Your QR code could not be prepared. Please refresh the page or try again later.');return}

      document.getElementById('card-preview-loading').style.display='none';
      document.getElementById('card-preview-content').hidden=false;
    }'''
          card = card[:start] + new_function + card[end:]
          card_path.write_text(card, encoding='utf-8')

      - name: Commit preview changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add portal/index.html card-preview/index.html
          git commit -m "Add multilingual card and profile previews"
          git push
