name: One-time multilingual portal preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-multilingual-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply multilingual preview changes
        run: python .github/scripts/add_multilingual_preview.py

      - name: Commit preview changes
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add portal/index.html card-preview/index.html
          git commit -m "Add multilingual card and profile previews"
          git push
