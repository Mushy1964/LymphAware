name: Final copy tidy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-copy-tidy.yml'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace remaining development-stage wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('understanding-lymphoedema/index.html')
          t = p.read_text(encoding='utf-8')
          old = '''            LymphAware is being developed so that someone living with\n            lymphoedema can communicate the information that matters to them\n            without having to rely solely on repeated explanations.'''
          new = '''            LymphAware helps someone living with lymphoedema communicate the\n            information that matters to them without having to rely solely on\n            repeated explanations.'''
          if old not in t and new not in t:
              raise SystemExit('Expected wording not found')
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t, encoding='utf-8')
          PY
      - name: Validate
        run: |
          ! grep -q "LymphAware is being developed" understanding-lymphoedema/index.html
          node scripts/audit-repo.mjs
      - name: Commit
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add understanding-lymphoedema/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove final development-stage wording"
          git push
