name: One-time awareness resources update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-awareness-resources-demo-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update awareness wording and trusted resources
        run: python scripts/one_time_awareness_resources_demo_update.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add index.html understanding-lymphoedema/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen awareness message and trusted resources"
          git push
