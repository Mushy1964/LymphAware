name: One-time welcome letter punctuation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-welcome-letter-punctuation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove duplicated welcome-letter full stops
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin/welcome-letter/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Your lymphoedema.</span>': 'Your lymphoedema</span>',
              'Your information.</span>': 'Your information</span>',
              'Your choice.</span>': 'Your choice</span>',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "LymphAware Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/welcome-letter/index.html
          git commit -m "Fix welcome letter punctuation"
          git push
