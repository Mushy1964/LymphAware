name: Reduce mobile hero gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reduce-mobile-hero-gap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce product to trial notice spacing on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/home-width-fix.css')
          css = p.read_text(encoding='utf-8')
          old = '''  .home-page .home-hero-product {\n    margin-bottom: 24px;\n  }'''
          new = '''  .home-page .home-hero-product {\n    margin-bottom: -10px;\n  }'''
          if old not in css:
              raise SystemExit('Expected mobile hero product spacing rule not found')
          p.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run repository audit
        run: node scripts/audit-repo.mjs
      - name: Commit change
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/home-width-fix.css
          git diff --cached --quiet && exit 0
          git commit -m "Reduce mobile hero image to trial notice gap"
          git push
