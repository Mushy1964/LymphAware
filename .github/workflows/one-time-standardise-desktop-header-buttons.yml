name: One-time standardise desktop header buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-standardise-desktop-header-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply desktop header button standardisation
        run: python scripts/one_time_standardise_desktop_header_buttons.py
      - name: Commit changes
        run: |
          git config user.name "Mushy1964"
          git config user.email "graham.rooms@gmail.com"
          git add css/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Standardise desktop header action buttons"
          git push
