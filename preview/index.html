<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview My QR Profile | LymphAware</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f8f7;color:#172536}
    .preview-page{min-height:100vh;padding:18px 12px 32px}
    .preview-shell{width:min(100%,620px);margin:0 auto}
    .preview-toolbar{margin-bottom:12px;padding:14px 16px;border:1px solid #cfe0e8;border-radius:14px;background:#eef6fb;color:#31566f;line-height:1.45}
    .preview-toolbar strong{color:#172536}
    .preview-frame-wrap{width:min(100%,520px);margin:0 auto}
    .preview-frame{display:block;width:100%;height:900px;border:0;background:#f5f8f7}
    .preview-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(100%,520px);margin:16px auto 0}
    .preview-actions .button{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px 12px;font-size:16px;font-weight:700;text-align:center;line-height:1.2}
    .preview-loading,.preview-error{padding:40px 20px;text-align:center;border:1px solid #dfe7e9;border-radius:18px;background:#fff;color:#566575}
    .preview-error{display:none}
    @media(max-width:600px){
      .preview-page{padding:8px 8px 24px}
      .preview-toolbar{font-size:.9rem;padding:12px 13px}
      .preview-frame{height:820px}
      .preview-actions{grid-template-columns:1fr}
      .preview-actions .button{width:100%}
    }
  </style>
</head>
<body>
  <main class="preview-page">
    <section class="preview-shell">
      <div class="preview-toolbar" id="preview-toolbar">
        <strong>Preview only.</strong>
        This is the same profile someone will see when they scan your LymphAware card.
      </div>

      <div id="preview-loading" class="preview-loading">Loading your QR profile preview…</div>
      <div id="preview-error" class="preview-error">Your QR profile preview could not be loaded.</div>

      <div id="preview-frame-wrap" class="preview-frame-wrap" hidden>
        <iframe
          id="preview-frame"
          class="preview-frame"
          title="Preview of my LymphAware QR profile"
          loading="eager">
        </iframe>
      </div>

      <div class="preview-actions">
        <a href="/profile/" class="button button-primary">Edit my profile</a>
        <a id="matching-card-link" href="/card-preview/" class="button button-secondary">Preview English ID card</a>
        <a href="/portal/" class="button button-secondary">Back to Portal</a>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL='https://thbhsktcenhrnxzkbjus.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi';
    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const LANGUAGE_NAMES={EN:'English',FR:'French',ES:'Spanish',DE:'German'};
    const requestedLanguage=String(new URLSearchParams(location.search).get('language')||'EN').toUpperCase();

    function showPreviewError(message){
      const loading=document.getElementById('preview-loading');
      const errorBox=document.getElementById('preview-error');
      loading.style.display='none';
      errorBox.textContent=message;
      errorBox.style.display='block';
    }

    async function loadPreview(){
      const loading=document.getElementById('preview-loading');
      const wrap=document.getElementById('preview-frame-wrap');
      const frame=document.getElementById('preview-frame');
      const toolbar=document.getElementById('preview-toolbar');
      const matchingCardLink=document.getElementById('matching-card-link');

      const {data:{user},error:userError}=await supabaseClient.auth.getUser();
      if(userError||!user){
        window.location.href='/sign-in/';
        return;
      }

      const language=LANGUAGE_NAMES[requestedLanguage]?requestedLanguage:'EN';
      const languageName=LANGUAGE_NAMES[language];
      let token='';
      let profileActive=false;

      if(language==='EN'){
        const {data:profile,error:profileError}=await supabaseClient
          .from('profiles')
          .select('qr_token,public_code,qr_profile_active')
          .eq('user_id',user.id)
          .single();

        if(profileError||!profile){
          showPreviewError('Your QR profile preview could not be loaded.');
          return;
        }

        token=profile.public_code||profile.qr_token||'';
        profileActive=profile.qr_profile_active===true;
      }else{
        const {data:languageProfile,error:languageError}=await supabaseClient
          .from('language_profiles')
          .select('language_name,language_code,qr_token,setup_status,qr_profile_active')
          .eq('user_id',user.id)
          .eq('language_code',language)
          .maybeSingle();

        if(languageError||!languageProfile){
          showPreviewError(`Your ${languageName} language package could not be found.`);
          return;
        }
        if(languageProfile.setup_status!=='APPROVED'||!languageProfile.qr_token){
          showPreviewError(`Your ${languageName} profile preview will be available when the automatic translation has finished.`);
          return;
        }

        token=languageProfile.qr_token;
        profileActive=languageProfile.qr_profile_active===true;
      }

      if(!token){
        showPreviewError(`Your ${languageName} QR profile does not yet have a profile link.`);
        return;
      }

      document.title=`Preview My ${languageName} QR Profile | LymphAware`;
      frame.title=`Preview of my ${languageName} LymphAware QR profile`;
      matchingCardLink.href=language==='EN'?'/card-preview/':`/card-preview/?language=${encodeURIComponent(language)}`;
      matchingCardLink.textContent=`Preview ${languageName} ID card`;

      if(profileActive){
        toolbar.innerHTML=`<strong>Preview only.</strong> This is the same ${languageName} profile someone will see when they scan your LymphAware card. Your QR profile is currently active.`;
      }else{
        toolbar.innerHTML=`<strong>Preview only.</strong> Your ${languageName} QR profile is currently switched off, so a scanner will see the unavailable-profile screen until you reactivate it.`;
      }

      frame.src=`/p/${encodeURIComponent(token)}`;
      frame.addEventListener('load',()=>{
        loading.style.display='none';
        wrap.hidden=false;
        try{
          const doc=frame.contentDocument;
          if(doc){
            const updateHeight=()=>{
              const h=Math.max(doc.documentElement.scrollHeight,doc.body?.scrollHeight||0,700);
              frame.style.height=`${Math.min(Math.max(h,700),1800)}px`;
            };
            updateHeight();
            setTimeout(updateHeight,250);
            setTimeout(updateHeight,800);
          }
        }catch{}
      },{once:true});
    }

    loadPreview();
  </script>
</body>
</html>
