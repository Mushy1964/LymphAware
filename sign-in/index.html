<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | LymphAware ID</title>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/secondary-header.css">
  <link rel="stylesheet" href="/css/card-system.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

  <style>
    .portal-page {
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-account-top) var(--space-page-gutter) var(--space-account-bottom);
      background: linear-gradient(135deg, rgba(36, 122, 36, .06), rgba(0, 83, 183, .05));
    }

    .portal-card {
      width: 100%;
      max-width: 520px;
      padding: 38px;
      border-radius: 22px;
      background: #fff;
    }

    .portal-card h1 {
      margin: 0 0 12px;
      font-size: 2.3rem;
      line-height: 1.15;
    }

    .portal-intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: 700; }
    .form-group input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #bfcbd2;
      border-radius: 9px;
      font: inherit;
      background: #fff;
    }
    .form-group input:focus {
      outline: 3px solid rgba(0, 83, 183, .18);
      border-color: var(--blue);
    }

    .forgot-password-row {
      margin: -8px 0 18px;
      text-align: right;
    }
    .forgot-password-row a {
      color: var(--blue);
      font-weight: 700;
    }

    .portal-button { width: 100%; margin-top: 4px; }
    #login-message { margin: 16px 0 0; line-height: 1.5; }
    #resend-confirmation { width: 100%; margin-top: 12px; }

    .portal-links {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .portal-links span { display: block; margin-bottom: 6px; }
    .portal-links a { color: var(--blue); font-weight: 700; }

    @media (max-width: 680px) {
      .portal-page { padding: var(--space-account-mobile-top) var(--space-page-gutter-mobile) var(--space-account-mobile-bottom); }
      .portal-card { padding: 26px 20px; }
      .portal-card h1 { font-size: 2rem; }
    }
  </style>
  <link rel="stylesheet" href="/css/brand-header.css?v=20260921-7">
</head>
<body>
  <header class="site-header secondary-header">
    <div class="container header-inner">
      <a href="/" class="header-brand" aria-label="Back to LymphAware ID website">
        <img class="header-logo" src="/assets/brand/LymphAwareID_Logo_20260921.svg" alt="LymphAware ID – Helping People Living with Lymphoedema Be Understood">
      </a>
      <div class="header-actions">
        <a href="/" class="button button-secondary back-to-website-button">Back to Website</a>
      </div>
    </div>
  </header>

  <main class="portal-page">
    <section class="portal-card" aria-labelledby="portal-heading">
      <p class="eyebrow">Patient Portal</p>
      <h1 id="portal-heading">Sign in to LymphAware ID</h1>
      <p class="portal-intro">
        Sign in to your LymphAware ID account. If you have just confirmed your email, you can continue with your selected package and complete secure payment.
      </p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <p class="forgot-password-row">
          <a href="/forgot-password/">Forgotten password?</a>
        </p>

        <button type="submit" class="button button-primary portal-button">Sign In</button>
        <p id="login-message" role="status" aria-live="polite"></p>
        <button type="button" id="resend-confirmation" class="button button-secondary" hidden>Resend confirmation email</button>
      </form>

      <div class="portal-links">
        <span>New to LymphAware ID?</span>
        <a href="/#membership">Choose a membership package</a>
      </div>

    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://thbhsktcenhrnxzkbjus.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const signInParams = new URLSearchParams(location.search);
    const requestedPackage = String(signInParams.get('package') || '').toUpperCase();
    const selectedPackage = ['STANDARD', 'PLUS', 'MULTILINGUAL'].includes(requestedPackage) ? requestedPackage : '';
    const requestedTerm = [1, 2, 3].includes(Number(signInParams.get('term'))) ? Number(signInParams.get('term')) : 0;
    const loginForm = document.getElementById('login-form');
    const loginMessage = document.getElementById('login-message');
    const resendConfirmationButton = document.getElementById('resend-confirmation');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      loginMessage.textContent = 'Signing in...';
      resendConfirmationButton.hidden = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        const errorCode = String(error.code || '').toLowerCase();
        const errorMessage = String(error.message || '').toLowerCase();
        if (errorCode === 'email_not_confirmed' || errorMessage.includes('email not confirmed')) {
          loginMessage.textContent = 'Your account has been created, but your email address has not yet been confirmed. Please open the LymphAware ID confirmation email, confirm your address, then sign in again.';
          resendConfirmationButton.hidden = false;
        } else {
          loginMessage.textContent = 'Sign in unsuccessful. Please check your email address and password and try again.';
        }
        return;
      }

      loginMessage.textContent = 'Sign in successful. Redirecting...';
      const signedInEmail = data?.user?.email?.toLowerCase() || '';

      if (signedInEmail === 'admin@lymphawareid.com') {
        window.location.href = '/admin/orders/';
      } else {
        const portalParams = new URLSearchParams();
        if (selectedPackage) portalParams.set('package', selectedPackage);
        if (requestedTerm) portalParams.set('term', String(requestedTerm));
        window.location.href = '/portal/' + (portalParams.toString() ? '?' + portalParams.toString() : '');
      }
    });

    resendConfirmationButton.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        loginMessage.textContent = 'Enter your email address first.';
        return;
      }
      resendConfirmationButton.disabled = true;
      loginMessage.textContent = 'Sending a new confirmation email...';
      const { error } = await supabaseClient.auth.resend({
        type: 'signup',
        email,
        options: { emailRedirectTo: 'https://lymphawareid.com/portal/?email=confirmed' }
      });
      if (error) {
        loginMessage.textContent = 'We could not resend the confirmation email just now. Please try again shortly.';
        resendConfirmationButton.disabled = false;
        return;
      }
      loginMessage.textContent = 'A new confirmation email has been sent. Check your inbox and spam/junk folder, confirm your email address, then sign in again.';
      resendConfirmationButton.textContent = 'Confirmation email sent';
    });
  </script>
</body>
</html>
