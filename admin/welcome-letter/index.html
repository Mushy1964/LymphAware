<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Letter | LymphAware Administration</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{background:#eef3f5}.letter-tools{display:flex;justify-content:space-between;align-items:center;gap:14px;width:min(100% - 28px,850px);margin:22px auto}.letter-tools div{display:flex;gap:10px;flex-wrap:wrap}.paper{box-sizing:border-box;width:min(100% - 28px,210mm);min-height:297mm;margin:0 auto 35px;padding:20mm;background:#fff;box-shadow:0 10px 35px rgba(31,41,51,.12);color:#172536;font:15.5px/1.48 Arial,sans-serif}.letter-logo{display:block;width:112mm;max-width:100%;margin-bottom:24px}.letter-date{margin-bottom:20px}.paper h1{margin:0 0 14px;color:#16853f;font-size:27px}.paper h2{margin:20px 0 5px;font-size:17px}.paper p{margin:0 0 12px}.letter-reference{margin:18px 0;padding:11px 14px;border-left:5px solid #1670ba;background:#eef6fb}.paper ul{margin:5px 0 12px;padding-left:22px}.letter-signature{margin-top:23px!important}.letter-footer{margin-top:29px;padding-top:12px;border-top:1px solid #ccd8de;color:#526273;font-size:11px}.letter-message{padding:80px 20px;text-align:center;color:#526273}@media(max-width:620px){.letter-tools{align-items:stretch;flex-direction:column}.letter-tools .button{width:100%}.paper{padding:25px 20px;min-height:0}}@page{size:A4;margin:0}@media print{body{background:#fff}.letter-tools{display:none}.paper{width:210mm;min-height:297mm;margin:0;padding:18mm 20mm;box-shadow:none}.letter-message{display:none}}
  </style>
</head>
<body>
  <div class="letter-tools"><a id="back-link" class="button button-secondary" href="/admin/">Back to Orders to Process</a><div><button type="button" id="print-letter" class="button button-primary" disabled>Print Welcome Letter</button></div></div>
  <main id="letter" class="paper"><div id="loading" class="letter-message">Preparing welcome letter...</div></main>
  <script>
    const SUPABASE_URL='https://thbhsktcenhrnxzkbjus.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi',supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),letter=document.getElementById('letter'),printButton=document.getElementById('print-letter'),backLink=document.getElementById('back-link'),orderId=new URLSearchParams(location.search).get('order');
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function orderRef(number){return `ORD-${String(number||0).padStart(6,'0')}`}
    function fulfilmentLines(order){const items=order.items||[],hasMembership=items.some(item=>item.item_type==='MEMBERSHIP'),english=(hasMembership?1:0)+items.filter(item=>item.item_type==='EXTRA_CARD').reduce((sum,item)=>sum+Number(item.quantity||0),0),lanyards=(hasMembership?1:0)+items.filter(item=>item.item_type==='LANYARD_HOLDER').reduce((sum,item)=>sum+Number(item.quantity||0),0),languages=[];for(const item of items.filter(item=>item.item_type==='LANGUAGE_PACKAGE')){const name=item.language_name||'Additional-language',existing=languages.find(entry=>entry.name.toLowerCase()===name.toLowerCase());if(existing)existing.quantity+=Number(item.quantity||0);else languages.push({name,quantity:Number(item.quantity||0)})}const lines=[];if(english)lines.push(`${english} English ID card${english===1?'':'s'}`);languages.forEach(entry=>lines.push(`${entry.quantity} ${entry.name} ID card${entry.quantity===1?'':'s'}`));if(lanyards)lines.push(`${lanyards} lanyard${lanyards===1?'':'s'} & holder${lanyards===1?'':'s'}`);return lines}
    function render(order){const profile=order.profile||{},name=profile.display_name||order.delivery_name||'LymphAware Member',patientId=profile.lymphaware_id||'Not yet assigned',items=fulfilmentLines(order).map(item=>`<li>${esc(item)}</li>`).join('');document.title=`Welcome Letter – ${orderRef(order.order_number)} | LymphAware`;backLink.href=order.order_status==='COMPLETED'?'/admin/completed-orders/':`/admin/orders/?order=${encodeURIComponent(order.id)}#order-${encodeURIComponent(order.id)}`;backLink.textContent=order.order_status==='COMPLETED'?'Back to Completed Orders':'Back to Order';letter.innerHTML=`<img class="letter-logo" src="/assets/brand/LymphAware_APPROVED_With_Tagline_v1.svg" alt="LymphAware – Helping People Living with Lymphoedema Be Understood."><div class="letter-date">${esc(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}))}</div><p>Dear ${esc(name)},</p><h1>Welcome to LymphAware</h1><p>Thank you for becoming a LymphAware member. Your card links to the QR profile you control, helping you share important information clearly when it may be difficult to explain it yourself.</p><div class="letter-reference"><strong>Your LymphAware ID:</strong> ${esc(patientId)}<br><strong>Order:</strong> ${esc(orderRef(order.order_number))}</div><h2>Enclosed with this letter</h2><ul>${items||'<li>No physical items recorded</li>'}</ul><h2>Using your LymphAware card</h2><p>The QR code links to your profile. No app or sign-in is required to view the information you have chosen to share. You remain in control and can update your profile whenever your information or needs change.</p><h2>Managing your profile</h2><p>Visit <strong>lymphaware.com/sign-in</strong> and sign in using the email address you registered with. For your security, passwords are never included in printed correspondence. If you forget your password, use the password-reset option on the sign-in page.</p><p class="letter-signature">With best wishes,<br><strong>The LymphAware Team</strong><br>admin@lymphaware.com</p><div class="letter-footer">LymphAware supports communication and awareness. It does not provide medical diagnosis or replace professional medical advice.</div>`;printButton.disabled=false}
    async function load(){if(!orderId){letter.innerHTML='<div class="letter-message">No order was selected.</div>';return}const {data:{session},error}=await supabaseClient.auth.getSession();if(error||!session?.access_token){location.href='/sign-in/';return}try{const response=await fetch('/.netlify/functions/admin-orders-list',{headers:{Authorization:`Bearer ${session.access_token}`}}),result=await response.json();if(!response.ok)throw new Error(result?.error||'The order could not be loaded.');const order=(result.orders||[]).find(item=>item.id===orderId);if(!order)throw new Error('The selected order could not be found.');render(order)}catch(error){console.error(error);letter.innerHTML=`<div class="letter-message">${esc(error.message||'The welcome letter could not be prepared.')}</div>`}}
    printButton.addEventListener('click',()=>window.print());load();
  </script>
</body>
</html>
