<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Order Notification | LymphAware</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#f7f9fa; }
    .wrap { max-width:760px; margin:60px auto; padding:0 18px; }
    .card { background:#fff; border:1px solid #cbd8df; border-radius:18px; padding:28px; box-shadow:var(--content-shadow); }
    h1 { margin-top:0; }
    #result { margin-top:18px; padding:14px 16px; border-radius:12px; background:#f4f7f8; white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <p class="eyebrow">Private Administration Area</p>
      <h1>Test Order Notification</h1>
      <p>This sends the notification for the most recent LymphAware order to admin@lymphaware.com and reports any Resend error directly.</p>
      <button id="send" class="button button-primary" type="button">Send Latest Order Notification</button>
      <a href="/admin/orders/" class="button button-secondary">Back to Orders</a>
      <div id="result">Ready.</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://thbhsktcenhrnxzkbjus.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const result = document.getElementById('result');
    const send = document.getElementById('send');

    send.addEventListener('click', async () => {
      send.disabled = true;
      result.textContent = 'Checking latest order...';

      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session?.access_token) {
        window.location.href = '/sign-in/';
        return;
      }

      try {
        const listResponse = await fetch('/.netlify/functions/admin-orders-list', {
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        const listResult = await listResponse.json();
        if (!listResponse.ok) throw new Error(listResult?.error || 'Could not load orders.');

        const order = listResult?.orders?.[0];
        if (!order?.id) throw new Error('No LymphAware order was found.');

        result.textContent = `Sending notification for LA-${String(order.order_number).padStart(6,'0')}...`;

        const response = await fetch('/.netlify/functions/admin-retry-order-notification', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${session.access_token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ orderId: order.id })
        });
        const data = await response.json();

        if (!response.ok) {
          result.textContent = `FAILED\n\n${data?.error || 'Notification failed.'}\n${data?.detail || ''}`;
          return;
        }

        result.textContent = `SUCCESS\n\nNotification sent.\nResend ID: ${data?.resendId || 'not returned'}`;
      } catch (error) {
        result.textContent = `FAILED\n\n${error.message}`;
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
