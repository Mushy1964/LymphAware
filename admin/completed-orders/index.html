<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Orders | LymphAware Administration</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page{min-height:calc(100vh - 84px);padding:50px 16px;background:#f7f9fa}.admin-shell{width:100%;max-width:1100px;margin:0 auto}.admin-heading h1{margin:6px 0 10px;font-size:2.4rem;line-height:1.15}.admin-heading>p:last-child{max-width:760px;margin:0;color:var(--muted);line-height:1.55}.admin-nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 28px}.history-list{display:grid;gap:16px}.history-card{padding:22px;border:1px solid var(--border);border-radius:17px;background:#fff;box-shadow:var(--content-shadow)}.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}.history-head h2{margin:0 0 5px;font-size:1.35rem}.history-name{margin:0;color:var(--muted);font-weight:700}.status{padding:7px 11px;border-radius:999px;background:var(--green-light);color:var(--green-dark);font-size:.88rem;font-weight:800}.history-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.detail{padding:13px 14px;border-radius:11px;background:#f7f9fa}.detail strong{display:block;margin-bottom:5px}.detail span{color:var(--muted);line-height:1.45}.items{margin:18px 0 0;padding:14px 16px 14px 36px;border-radius:11px;background:var(--blue-light);color:var(--blue-dark)}.items li+li{margin-top:4px}.history-actions{display:flex;justify-content:flex-end;margin-top:16px}.empty{padding:26px;border:1px solid var(--border);border-radius:15px;background:#fff;color:var(--muted)}#loading{padding:55px 15px;text-align:center;color:var(--muted)}@media(max-width:820px){.history-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.admin-page{padding:34px 13px}.admin-heading h1{font-size:2rem}.admin-nav .button,.history-actions .button{width:100%}.history-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a href="/" class="header-brand" aria-label="LymphAware home"><img class="header-logo" src="/assets/brand/LymphAware_APPROVED_With_Tagline_v1.svg" alt="LymphAware – Helping People Living with Lymphoedema Be Understood."></a><div class="header-actions"><button type="button" id="admin-sign-out" class="button button-secondary">Sign Out</button></div></div></header>
  <main class="admin-page"><section class="admin-shell">
    <div class="admin-heading"><p class="eyebrow">Private Administration Area</p><h1>Completed Orders</h1><p>A permanent history of orders that have finished the profile, card-production and fulfilment process.</p></div>
    <nav class="admin-nav" aria-label="Administration"><a href="/admin/" class="button button-secondary">Orders to Process</a><a href="/admin/completed-orders/" class="button button-primary">Completed Orders</a></nav>
    <div id="loading">Loading completed orders...</div><div id="history-list" class="history-list" hidden></div>
  </section></main>
  <script>
    const SUPABASE_URL='https://thbhsktcenhrnxzkbjus.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_poyzEEwONnXEqVgepPF6aQ_6qbaLFpi',supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),loading=document.getElementById('loading'),historyList=document.getElementById('history-list');
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function orderRef(number){return `ORD-${String(number||0).padStart(6,'0')}`}
    function money(pence){return `£${(Number(pence||0)/100).toFixed(2)}`}
    function date(value){return value?new Date(value).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Not recorded'}
    function render(orders){const completed=orders.filter(order=>order.order_status==='COMPLETED').sort((a,b)=>new Date(b.completed_at||b.updated_at||0)-new Date(a.completed_at||a.updated_at||0));loading.style.display='none';historyList.hidden=false;if(!completed.length){historyList.innerHTML='<div class="empty">No orders have been completed yet.</div>';return}historyList.innerHTML=completed.map(order=>{const profile=order.profile||{},items=(order.items||[]).map(item=>`<li>${Number(item.quantity||1)} × ${esc(item.description||item.item_type)}${item.language_name?` – ${esc(item.language_name)}`:''}</li>`).join('');return `<article class="history-card" id="order-${esc(order.id)}"><div class="history-head"><div><h2>${esc(orderRef(order.order_number))}</h2><p class="history-name">${esc(profile.display_name||order.delivery_name||'LymphAware customer')}</p></div><span class="status">Completed</span></div><div class="history-grid"><div class="detail"><strong>Paid</strong><span>${esc(date(order.paid_at))}</span></div><div class="detail"><strong>Completed</strong><span>${esc(date(order.completed_at||order.updated_at))}</span></div><div class="detail"><strong>Patient ID</strong><span>${esc(profile.lymphaware_id||'Not recorded')}</span></div><div class="detail"><strong>Paid total</strong><span>${esc(money(order.total_pence))}</span></div></div><ul class="items">${items||'<li>No item detail recorded</li>'}</ul><div class="history-actions"><a class="button button-secondary" href="/admin/welcome-letter/?order=${encodeURIComponent(order.id)}" target="_blank" rel="noopener">Print Welcome Letter</a></div></article>`}).join('')}
    async function load(){const {data:{session},error}=await supabaseClient.auth.getSession();if(error||!session?.access_token){location.href='/sign-in/';return}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const response=await fetch('/.netlify/functions/admin-orders-list',{headers:{Authorization:`Bearer ${session.access_token}`},signal:controller.signal}),result=await response.json();if(!response.ok)throw new Error(result?.error||'Completed orders could not be loaded.');render(result.orders||[])}catch(error){console.error(error);loading.textContent='Completed orders could not be loaded. Please refresh and try again.'}finally{clearTimeout(timer)}}
    document.getElementById('admin-sign-out').addEventListener('click',async()=>{await supabaseClient.auth.signOut();location.href='/sign-in/'});load();
  </script>
</body>
</html>
