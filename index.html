<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LymphAware | Helping People Living with Lymphoedema Be Understood</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #263238;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      box-sizing: border-box;
    }

    .welcome {
      width: 100%;
      max-width: 980px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5rem);
      letter-spacing: -2px;
      line-height: 1;
    }

    .lymph {
      color: #4c9b57;
    }

    .aware {
      color: #2878b8;
    }

    .tagline {
      margin: 0 auto 30px;
      max-width: 900px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      line-height: 1.35;
      font-weight: 600;
      text-wrap: balance;
    }

    .message {
      margin: 0 auto;
      max-width: 700px;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #52616b;
    }

    .status {
      display: inline-block;
      margin-top: 36px;
      padding: 10px 18px;
      border-radius: 30px;
      background: #f0f7f2;
      color: #367642;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .brand {
        gap: 10px;
      }

      .brand-icon {
        width: 58px;
        height: 58px;
      }

      h1 {
        font-size: clamp(2rem, 11vw, 3.2rem);
      }

      .tagline {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="welcome">

      <div class="brand">

        <svg
          class="brand-icon"
          viewBox="0 0 100 100"
          role="img"
          aria-label="LymphAware logo icon"
        >
          <circle cx="50" cy="18" r="10" fill="#4c9b57"/>

          <path
            d="M46 75
               C30 70, 20 56, 20 37
               C34 39, 43 48, 48 60
               Z"
            fill="#4c9b57"
          />

          <path
            d="M54 75
               C70 70, 80 56, 80 37
               C66 39, 57 48, 52 60
               Z"
            fill="#2878b8"
          />

          <ellipse
            cx="50"
            cy="82"
            rx="18"
            ry="4"
            fill="#2878b8"
          />
        </svg>

        <h1>
          <span class="lymph">LYMPH</span><span class="aware">AWARE</span>
        </h1>

      </div>

      <p class="tagline">
        Helping People Living with Lymphoedema Be Understood.
      </p>

      <p class="message">
        LymphAware is a patient-led project being developed to help people
        living with lymphoedema communicate important information when they
        need support, assistance or understanding.
      </p>

      <div class="status">
        Website development in progress
      </div>

    </section>
  </main>
</body>
</html>
