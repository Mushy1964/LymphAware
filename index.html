<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LymphAware | Helping People Living with Lymphoedema Be Understood</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #263238;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      box-sizing: border-box;
    }

    .welcome {
      max-width: 760px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.6rem, 8vw, 5rem);
      letter-spacing: -2px;
    }

    .lymph {
      color: #4c9b57;
    }

    .aware {
      color: #2878b8;
    }

    .tagline {
      margin: 0 0 30px;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      line-height: 1.4;
      font-weight: 600;
    }

    .message {
      margin: 0 auto;
      max-width: 620px;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #52616b;
    }

    .status {
      display: inline-block;
      margin-top: 36px;
      padding: 10px 18px;
      border-radius: 30px;
      background: #f0f7f2;
      color: #367642;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <section class="welcome">
      <h1>
        <span class="lymph">LYMPH</span><span class="aware">AWARE</span>
      </h1>

      <p class="tagline">
        Helping People Living with Lymphoedema Be Understood.
      </p>

      <p class="message">
        LymphAware is a patient-led project being developed to help people
        living with lymphoedema communicate important information when they
        need support, assistance or understanding.
      </p>

      <div class="status">
        Website development in progress
      </div>
    </section>
  </main>
</body>
</html>
