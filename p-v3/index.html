<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>LymphAware Patient Profile</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#172536}.page{min-height:100vh;padding:12px 10px 28px}.shell{width:min(100%,520px);margin:auto}.brand{padding:0 8px 10px}.brand img{display:block;width:100%;max-width:430px;margin:auto}.card{overflow:hidden;border:1px solid #d7e1e4;border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(31,41,51,.08)}.identity{padding:16px;background:linear-gradient(135deg,#edf7ef,#eef6fb);display:flex;gap:14px;align-items:center}.photo{width:86px;height:104px;flex:0 0 86px;border-radius:12px;overflow:hidden;display:none}.photo img{width:100%;height:100%;object-fit:cover}.identity h1{margin:0 0 8px;font-size:1.7rem}.status{display:inline-block;margin:0 0 10px;padding:6px 10px;border-radius:999px;background:#16853f;color:#fff;font-weight:800;font-size:.8rem}.id{margin:0;color:#566575;font-weight:600;display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap;white-space:nowrap}.id span{color:#172536;font-weight:800;margin-left:0}.id #patient-id{white-space:nowrap}.menu{padding:9px}.section{margin-bottom:6px}.toggle{width:100%;min-height:72px;display:grid;grid-template-columns:50px 1fr 18px;gap:11px;align-items:center;padding:9px;border:1px solid #d8e2e5;border-radius:13px;background:#fff;text-align:left;font:inherit}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px}.green{background:#e2f4e7}.blue{background:#e1effb}.icon img{width:35px;height:35px;object-fit:contain}.label strong{display:block;font-size:1rem;margin-bottom:2px;color:#172536}.label span{display:block;color:#566575;font-size:.86rem;line-height:1.3}.chev{width:10px;height:10px;border-right:2px solid #67808f;border-bottom:2px solid #67808f;transform:rotate(45deg)}.toggle[aria-expanded="true"] .chev{transform:rotate(225deg)}.panel{margin-top:6px;padding:14px;border:1px solid #dfe7e9;border-radius:13px;background:#f9fbfa}.panel[hidden]{display:none}.detail{padding:11px 12px;margin-bottom:9px;border-radius:10px;background:#fff}.detail:last-child{margin-bottom:0}.detail strong{display:block;margin-bottom:3px;font-size:.85rem}.detail span,.panel p{color:#566575;line-height:1.5;white-space:pre-line}.empty{padding:12px;border-radius:10px;background:#fff;color:#667786;font-style:italic}.assist{display:grid;gap:9px}.assist-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border:1px solid #d8e2e5;border-radius:12px;background:#fff}.assist-item img{width:40px;height:40px}.call{display:flex;justify-content:center;align-items:center;min-height:48px;margin-top:12px;border-radius:11px;background:#16853f;color:#fff;text-decoration:none;font-weight:800}.footer{margin-top:8px;padding:12px 14px;border:1px solid #ebcaca;border-radius:14px;background:#fff2f2;color:#566575;font-size:.8rem;line-height:1.45}.footer-heading{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:#172536;font-size:.95rem;font-weight:800}.footer-icon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px}.footer-icon img{display:block;width:26px;height:26px;object-fit:contain}.footer p{margin:0 0 7px}.footer p:last-child{margin-bottom:0}.message{padding:44px 20px;border:1px solid #dfe7e9;border-radius:20px;background:#fff;text-align:center}.message p{color:#566575}.hidden{display:none!important}@media(max-width:600px){.page{padding-top:9px}.brand{padding-bottom:7px}.identity{padding:12px;gap:12px}.photo{width:78px;height:94px;flex-basis:78px}.identity h1{margin-bottom:6px;font-size:1.58rem}.status{margin-bottom:7px;padding:5px 9px}.menu{padding:7px}.section{margin-bottom:4px}.toggle{min-height:64px;grid-template-columns:46px 1fr 16px;gap:9px;padding:7px}.icon{width:44px;height:44px;border-radius:13px}.icon img{width:32px;height:32px}.footer{margin-top:6px;padding:10px 12px;line-height:1.35}.footer-heading{margin-bottom:5px}.footer p{margin-bottom:5px}}@media(max-width:360px){.identity{padding:10px}.photo{width:68px;height:84px;flex-basis:68px}.identity h1{font-size:1.45rem}.toggle{grid-template-columns:44px 1fr 16px}.icon{width:42px;height:42px}.icon img{width:31px;height:31px}}
</style>
</head>
<body>
<main class="page"><div class="shell">
<div class="brand"><img src="/assets/brand/LymphAware_APPROVED_With_Tagline_v1.svg" alt="LymphAware"></div>
<div id="loading" class="message"><h1>Loading profile…</h1><p>Please wait while the LymphAware profile is retrieved.</p></div>
<div id="error" class="message hidden"><h1>LymphAware profile unavailable</h1><p>This LymphAware profile is currently unavailable.</p></div>
<article id="content" class="card hidden">
<header class="identity"><div id="photo" class="photo"></div><div><h1 id="name"></h1><p id="status" class="status"></p><p class="id"><span id="id-label">LymphAware ID:</span><span id="patient-id"></span></p></div></header>
<div class="menu">
<section class="section"><button class="toggle" data-panel="lymph" aria-expanded="false"><span class="icon green"><img src="/assets/icons/AboutMe_Green.svg" alt=""></span><span class="label"><strong id="lymph-title"></strong><span id="lymph-desc"></span></span><span class="chev"></span></button><div id="lymph" class="panel" hidden></div></section>
<section class="section"><button class="toggle" data-panel="compression" aria-expanded="false"><span class="icon blue"><img src="/assets/icons/Compression_Blue.svg" alt=""></span><span class="label"><strong id="compression-title"></strong><span id="compression-desc"></span></span><span class="chev"></span></button><div id="compression" class="panel" hidden></div></section>
<section class="section"><button class="toggle" data-panel="treatment" aria-expanded="false"><span class="icon green"><img src="/assets/icons/Treatment_Green.svg" alt=""></span><span class="label"><strong id="treatment-title"></strong><span id="treatment-desc"></span></span><span class="chev"></span></button><div id="treatment" class="panel" hidden></div></section>
<section class="section"><button class="toggle" data-panel="assistance" aria-expanded="false"><span class="icon blue"><img src="/assets/icons/Assistance_Blue.svg" alt=""></span><span class="label"><strong id="assistance-title"></strong><span id="assistance-desc"></span></span><span class="chev"></span></button><div id="assistance" class="panel" hidden></div></section>
<section class="section"><button class="toggle" data-panel="emergency" aria-expanded="false"><span class="icon green"><img src="/assets/icons/ContactDetails_Green.svg" alt=""></span><span class="label"><strong id="emergency-title"></strong><span id="emergency-desc"></span></span><span class="chev"></span></button><div id="emergency" class="panel" hidden></div></section>
<section class="section"><button class="toggle" data-panel="additional" aria-expanded="false"><span class="icon blue"><img src="/assets/icons/AddInfo_Blue.svg" alt=""></span><span class="label"><strong id="additional-title"></strong><span id="additional-desc"></span></span><span class="chev"></span></button><div id="additional" class="panel" hidden></div></section>
<div class="footer"><div class="footer-heading"><span class="footer-icon" aria-hidden="true"><img src="/assets/icons/exclamation.svg" alt=""></span><span id="footer-title"></span></div><p id="footer-1"></p><p id="footer-2"></p></div>
</div></article>
</div></main>
<script>
const API='https://thbhsktcenhrnxzkbjus.supabase.co/functions/v1/public-profile';
const ICONS={standing:'standing.png',seating:'seating.png',time:'extra-time.png',mobility:'mobility.png','extra-space':'extra-space.png',understanding:'understanding.png'};
const T={EN:{status:'LYMPHOEDEMA PATIENT',id:'LymphAware ID:',empty:'No information has been added to this section.',not:'Not provided',type:'Type',location:'Location',name:'Name',relationship:'Relationship',telephone:'Telephone',call:'Call emergency contact',sections:{lymph:['About My Lymphoedema','An overview of my condition.'],compression:['Compression','My garments and preferences.'],treatment:['Treatment Considerations','Important information for my care.'],assistance:['Assistance Information','How you can help me.'],emergency:['Emergency Contact','Who to contact in an emergency.'],additional:['Additional Information','Other information that may help.']},footer:['About this profile','This information has been chosen by the member to help others understand their lymphoedema and support needs.','It does not replace medical advice or emergency care.']},FR:{status:'PATIENT ATTEINT DE LYMPHŒDÈME',id:'ID LymphAware :',empty:'Aucune information n’a été ajoutée à cette section.',not:'Non renseigné',type:'Type',location:'Localisation',name:'Nom',relationship:'Lien avec la personne',telephone:'Téléphone',call:'Appeler le contact d’urgence',sections:{lymph:['À propos de mon lymphœdème','Un aperçu de mon lymphœdème.'],compression:['Compression','Mes vêtements et préférences.'],treatment:['Informations sur le traitement','Informations importantes pour mes soins.'],assistance:['Aide et assistance','Comment vous pouvez m’aider.'],emergency:['Contact d’urgence','Personne à contacter en cas d’urgence.'],additional:['Informations complémentaires','Autres informations utiles.']},footer:['À propos de ce profil','Ces informations ont été choisies par le membre pour aider les autres à comprendre son lymphœdème et ses besoins.','Elles ne remplacent pas un avis médical ou les services d’urgence.']}};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const has=s=>typeof s==='string'&&s.trim();
const token=()=>{const q=new URLSearchParams(location.search).get('token');if(q)return q;const p=location.pathname.split('/').filter(Boolean);return p[0]==='p'?p[1]:null};
const empty=t=>`<div class="empty">${t.empty}</div>`;
const detail=(label,value,t)=>`<div class="detail"><strong>${label}</strong><span>${esc(has(value)?value:t.not)}</span></div>`;
function setLabels(t){document.documentElement.lang=t===T.FR?'fr':'en-GB';document.getElementById('status').textContent=t.status;document.getElementById('id-label').textContent=t.id;for(const k of Object.keys(t.sections)){document.getElementById(`${k}-title`).textContent=t.sections[k][0];document.getElementById(`${k}-desc`).textContent=t.sections[k][1]}document.getElementById('footer-title').textContent=t.footer[0];document.getElementById('footer-1').textContent=t.footer[1];document.getElementById('footer-2').textContent=t.footer[2]}
document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const p=document.getElementById(b.dataset.panel),open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));p.hidden=open}));
(async()=>{const tk=token();if(!tk){loading.classList.add('hidden');error.classList.remove('hidden');return}try{const r=await fetch(`${API}?token=${encodeURIComponent(tk)}`,{cache:'no-store'});if(!r.ok)throw new Error();const p=await r.json();const t=p.language_code==='FR'?T.FR:T.EN;setLabels(t);document.getElementById('name').textContent=p.display_name||'LymphAware Patient';document.getElementById('patient-id').textContent=p.lymphaware_id||t.not;if(has(p.photo_url)){photo.innerHTML=`<img src="${esc(p.photo_url)}" alt="">`;photo.style.display='block'}
const l=document.getElementById('lymph');l.innerHTML=(has(p.lymphoedema_type)||has(p.lymphoedema_location))?detail(t.type,p.lymphoedema_type,t)+detail(t.location,p.lymphoedema_location,t):empty(t);
document.getElementById('compression').innerHTML=has(p.compression_information)?`<p>${esc(p.compression_information)}</p>`:empty(t);
document.getElementById('treatment').innerHTML=has(p.treatment_considerations)?`<p>${esc(p.treatment_considerations)}</p>`:empty(t);
const a=document.getElementById('assistance');let ah='';if(Array.isArray(p.assistance))for(const o of p.assistance){if(!o||!has(o.statement))continue;const img=ICONS[o.icon_key]?`<img src="/assets/icons/${ICONS[o.icon_key]}" alt="">`:'';ah+=`<div class="assist-item">${img}<span>${esc(o.statement)}</span></div>`}if(has(p.assistance_needs))ah+=`<div class="detail"><span>${esc(p.assistance_needs)}</span></div>`;a.innerHTML=ah||empty(t);
const c=p.emergency_contact||{};const e=document.getElementById('emergency');if(has(c.name)||has(c.relationship)||has(c.phone)){e.innerHTML=detail(t.name,c.name,t)+detail(t.relationship,c.relationship,t)+detail(t.telephone,c.phone,t);if(has(c.phone))e.innerHTML+=`<a class="call" href="tel:${String(c.phone).replace(/[^0-9+]/g,'')}">${esc(has(c.name)?(t===T.FR?`Appeler ${c.name}`:`Call ${c.name}`):t.call)}</a>`}else e.innerHTML=empty(t);
document.getElementById('additional').innerHTML=has(p.additional_statement)?`<p>${esc(p.additional_statement)}</p>`:empty(t);loading.classList.add('hidden');content.classList.remove('hidden')}catch{loading.classList.add('hidden');error.classList.remove('hidden')}})();
</script>
</body></html>
