<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Unsubscribe from updates | LymphAware ID</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/secondary-header.css"><link rel="stylesheet" href="/css/brand-header.css?v=20260921-7">
<style>.confirm-page{padding:50px 16px;min-height:60vh;background:#f6faf9}.confirm-card{max-width:620px;margin:auto;background:white;border:1px solid #d4e5e6;border-top:5px solid #25823c;padding:30px;border-radius:16px}.confirm-card h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.2}.confirm-card p{line-height:1.6}.confirm-card .button{margin-top:15px}.confirm-card a{color:#0053b7}</style></head><body><header class="site-header secondary-header"><div class="container header-inner"><a href="/" class="header-brand"><img class="header-logo" src="/assets/brand/LymphAwareID_Logo_20260921.svg" alt="LymphAware ID"></a><div class="header-actions"><a href="/" class="button button-secondary">Back to Website</a></div></div></header><main class="confirm-page"><section class="confirm-card"><h1>Unsubscribe from updates</h1><p id="intro">Select the button below if you no longer wish to receive pre-launch interest emails from LymphAware ID.</p><button id="action" type="button" class="button button-primary">Unsubscribe</button><p role="status" aria-live="polite" id="status"></p><p><a href="/privacy/">Read our Privacy Notice</a></p></section></main>
<script>
const btn=document.getElementById('action'),out=document.getElementById('status'),token=new URLSearchParams(location.search).get('token')||'';history.replaceState(null,'',location.pathname);
if(!/^[a-f0-9]{64}$/.test(token)){btn.hidden=true;out.textContent='This link is invalid or incomplete.';}
btn.addEventListener('click',async()=>{btn.disabled=true;out.textContent='Processing…';try{const r=await fetch('/api/prelaunch-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');out.textContent="Your request has been recorded. You will not receive further pre-launch interest emails.";btn.hidden=true;}catch(e){out.textContent=e.message;btn.disabled=false;}});
</script></body></html>
